<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>{{ og_title | default('가계쀼 - 공유 가계부') }}</title>

    <meta property="og:title" content="{{ og_title | default('가계쀼 - 공유 가계부') }}">
    <meta property="og:description" content="{{ og_desc | default('부부가 함께 쓰는 귀여운 가계부, 수입과 지출을 쉽고 투명하게 관리해보세요.') }}">
    <meta property="og:image" content="{{ request.host_url }}static/icon-512.png">
    <meta property="og:url" content="{{ request.url }}">

    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <style>
        :root {
            --color-primary: #22B57F; --color-action: #17945F; --color-canvas: #ffffff;
            --color-foreground: #111111; --color-secondary: #555c68; --color-line: #f0f2f5;
            --font-sans: Pretendard, -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
        }
        body { font-family: var(--font-sans); background-color: var(--color-canvas); color: var(--color-foreground); margin:0; display:flex; flex-direction: column; justify-content:center; align-items:center; gap: 16px; height:100vh; }
        .splash-logo { width: 56px; height: 56px; border-radius: 14px; }
        .splash-wordmark-wrap { display: flex; flex-direction: column; align-items: center; gap: 2px; }
        .splash-wordmark { color: var(--color-foreground); font-size: 16px; font-weight: 800; letter-spacing: 0.3px; }
        .splash-ledger-name { color: var(--color-secondary); font-size: 12px; }
        .splash-progress-track { width: 140px; height: 4px; border-radius: 2px; background: var(--color-line); overflow: hidden; margin-top: 4px; }
        .splash-progress-fill { width: 0%; height: 100%; background: var(--color-action); border-radius: 2px; transition: width 0.25s ease; }

        dialog { border: 1px solid var(--color-line); border-radius: 24px; padding: 24px; width: 90%; max-width: 400px; margin: auto; background: var(--color-canvas); box-shadow: 0 17px 50px rgba(0,0,0,.19); box-sizing: border-box; }
        dialog::backdrop { background: rgba(17, 17, 17, 0.4); }
        .btn-action { display: inline-flex; align-items: center; justify-content: center; background-color: var(--color-action); color: var(--color-canvas); border-radius: 16px; padding: 12px 20px; font-size: 16px; font-weight: 700; border: none; cursor: pointer; text-decoration: none; width: 100%; box-sizing: border-box; }
    </style>
</head>
<body>
    <!-- 로그인 정보가 없으면 곧바로 /login으로 넘어가므로, 실제 로딩이 필요한 경우에만
         아래 스플래시(로고+진행바)가 그려지도록 스크립트를 body 맨 앞에 둔다.
         이 페이지는 뒤에서 document.write()로 실제 앱 페이지(base.html) 전체로 通째 교체되는데,
         document.write는 같은 전역 스코프를 그대로 재사용하기 때문에 여기서 최상위
         const/let을 쓰면 교체될 페이지 쪽 스크립트의 동일한 이름과 충돌해 SyntaxError로
         죽어버린다 (실제로 겪은 버그). IIFE로 감싸고 var만 써서 격리한다. -->
    <script>
        (function() {
            var token = localStorage.getItem('jwt_token');

            if (window.location.pathname.startsWith('/invite/')) {
                var hash = window.location.pathname.split('/').pop();
                localStorage.setItem('pending_invite', hash);
            }

            if (!token) {
                window.location.replace('/login');
                return;
            }

            // 마지막으로 보고 있던 탭/페이지를 기억해뒀다가, PWA 아이콘 실행 등으로
            // start_url("/")에 진입했을 때는 그 페이지부터 이어서 보여준다.
            var REMEMBERED_PREFIXES = ['/home', '/calendar', '/transactions', '/settings', '/mypage'];
            function saveLastPage(pathWithSearch) {
                var path = pathWithSearch.split('?')[0];
                var ok = path === '/' || REMEMBERED_PREFIXES.some(function(p) { return path === p || path.startsWith(p + '/'); });
                if (ok) localStorage.setItem('gb_last_page', pathWithSearch);
            }

            var targetPath = window.location.pathname + window.location.search;
            if (window.location.pathname === '/') {
                var last = localStorage.getItem('gb_last_page');
                if (last && last !== '/') targetPath = last;
            }
            if (targetPath !== window.location.pathname + window.location.search) {
                window.history.replaceState(null, '', targetPath);
            }
            saveLastPage(targetPath);

            window.__gbToken = token;
            window.__gbTargetUrl = window.location.origin + targetPath;
            window.__gbLedgerName = localStorage.getItem('gb_ledger_name') || '';
        })();
    </script>

    <img src="/static/icon-192.png" alt="가계쀼" class="splash-logo">
    <div class="splash-wordmark-wrap">
        <div class="splash-wordmark">가계쀼</div>
        <div class="splash-ledger-name" id="splash-ledger-name"></div>
    </div>
    <div class="splash-progress-track"><div class="splash-progress-fill" id="splash-progress"></div></div>
    <script>
        (function() {
            var name = window.__gbLedgerName;
            if (name) document.getElementById('splash-ledger-name').textContent = name;
        })();
    </script>

    <dialog id="db-error-dialog">
        <div style="text-align: center; padding: 10px 0;">
            <div style="font-size: 40px; margin-bottom: 16px;">⏳</div>
            <h3 style="font-size: 18px; font-weight: 700; margin-bottom: 8px;">DB 연결 지연</h3>
            <p style="font-size: 14px; color: var(--color-secondary); margin-bottom: 24px; line-height: 1.5;">
                현재 서버 접속이 원활하지 않습니다.<br>아래 버튼을 눌러 다시 시도해주세요.
            </p>
            <button type="button" class="btn-action" onclick="window.location.reload();">새로고침 시도하기</button>
        </div>
    </dialog>

    <script>
        (function() {
            var token = window.__gbToken;
            if (!token) return;
            var currentUrl = window.__gbTargetUrl;

            var setProgress = function(pct) {
                var bar = document.getElementById('splash-progress');
                if (bar) bar.style.width = pct + '%';
            };
            setProgress(20); // 로그인 정보 확인 완료

            var fetchWithRetry = async function(url, options, maxRetries) {
                maxRetries = maxRetries || 3;
                var attempt = 0;
                var delay = 500;
                while (attempt <= maxRetries) {
                    try {
                        var res = await fetch(url, options);
                        if (res.status >= 500 && attempt < maxRetries) {
                            attempt++;
                            await new Promise(function(r) { setTimeout(r, delay); });
                            delay *= 2;
                            continue;
                        }
                        return res;
                    } catch (e) {
                        if (attempt < maxRetries) {
                            attempt++;
                            await new Promise(function(r) { setTimeout(r, delay); });
                            delay *= 2;
                            continue;
                        }
                        throw e;
                    }
                }
            };

            setProgress(45); // 서버 요청 시작
            fetchWithRetry(currentUrl, {
                headers: { 'Authorization': 'Bearer ' + token, 'X-Requested-With': 'XMLHttpRequest' }
            }, 3)
            .then(function(res) {
                setProgress(80); // 응답 수신
                if (res.status === 401) {
                    localStorage.removeItem('jwt_token');
                    window.location.href = '/login';
                } else if (res.status >= 500) {
                    document.getElementById('db-error-dialog').showModal();
                } else {
                    return res.text();
                }
            })
            .then(function(html) {
                if (html) {
                    setProgress(100);
                    setTimeout(function() {
                        document.open(); document.write(html); document.close();
                    }, 150);
                }
            }).catch(function() {
                document.getElementById('db-error-dialog').showModal();
            });
        })();
    </script>
</body>
</html>
