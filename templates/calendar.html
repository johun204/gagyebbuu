{% extends "base.html" %}
{% from '_icons.html' import icon %}
{% block content %}
<style>
    #calendar-slider-wrapper { overflow: hidden; width: 100%; position: relative; touch-action: pan-y; }
    #calendar-slider { display: flex; align-items: flex-start; width: 300%; transform: translateX(-33.333%); will-change: transform; }
    .calendar-slide { width: 33.333%; flex-shrink: 0; }
    .cal-week, .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); }
    .cal-week { text-align: center; font-size: 12px; font-weight: 600; color: var(--text-3); margin-bottom: 6px; }
    .cal-week .sun { color: var(--expense); } .cal-week .sat { color: var(--brand); }
    .cal-grid { gap: 4px; }
    .cal-cell { min-height: 58px; border-radius: 12px; display: flex; flex-direction: column; align-items: center; padding: 5px 1px 4px; cursor: pointer; border: 2px solid transparent; background: none; font: inherit; color: inherit; overflow: hidden; }
    .cal-cell.selected { border-color: var(--brand); }
    .cal-cell .d { font-size: 13px; font-weight: 600; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; border-radius: 50%; }
    .cal-cell.today .d { background: var(--brand); color: var(--on-brand); }
    .cal-cell .inc, .cal-cell .exp { font-size: 10.5px; font-weight: 700; line-height: 1.25; letter-spacing: -0.04em; white-space: nowrap; }
    .cal-cell .inc { color: var(--income); } .cal-cell .exp { color: var(--text); }
    .month-sum { display: flex; gap: 14px; font-size: 13.5px; margin: -4px 0 12px; color: var(--text-2); }
    .month-sum b { font-weight: 700; }
</style>

<div class="appbar">
    <h1>달력</h1>
    <div class="month-nav">
        <button type="button" class="icon-btn" style="width:32px;height:32px;" onclick="window.shiftMonth(-1)" aria-label="이전 달">{{ icon('chevron-left', 20) }}</button>
        <button type="button" class="label" id="cal-month-header" style="font-size:16px;" onclick="window.openMonthPicker(window.currentY, window.currentM)">{{ t_year }}년 {{ t_month }}월</button>
        <button type="button" class="icon-btn" style="width:32px;height:32px;" onclick="window.shiftMonth(1)" aria-label="다음 달">{{ icon('chevron-right', 20) }}</button>
    </div>
    <a href="/settings" class="icon-btn" aria-label="설정">{{ icon('settings', 24) }}</a>
</div>

<div class="month-sum" id="cal-month-sum"></div>

<div class="card tight" style="padding: 12px 10px;">
    <div class="cal-week"><div class="sun">일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div class="sat">토</div></div>
    <div id="calendar-slider-wrapper">
        <div id="calendar-slider">
            <div id="slide-prev" class="calendar-slide"></div>
            <div id="slide-curr" class="calendar-slide"></div>
            <div id="slide-next" class="calendar-slide"></div>
        </div>
    </div>
    <p class="caption" style="margin-top: 8px; padding: 0 4px;">칸 색이 진할수록 그날 지출이 많아요</p>
</div>

<div class="card">
    <div class="section-head">
        <h2 id="daily-list-title"></h2>
        <button type="button" class="more" style="color: var(--brand); font-weight: 600;" onclick="window.openTxSheet({date: window.selectedDate})">{{ icon('plus', 16) }} 이 날 추가</button>
    </div>
    <div id="daily-tx-list" class="list"></div>
</div>

<script>
    window.initialData = {{ initial_data | tojson }};
    window.currentY = {{ t_year }};
    window.currentM = {{ t_month }};
    window.todayDate = {{ today_date | tojson }};
</script>

<script>
{
    const esc = window.escapeHtml, won = window.won;
    window.allMonthsData = {};
    window.txDataStore = {};

    window.fetchMonthData = async function(y, m) {
        const key = `${y}-${m}`;
        if (window.allMonthsData[key]) return window.allMonthsData[key];
        const res = await fetch(`/api/calendar_data?year=${y}&month=${m}`);
        const data = await res.json();
        window.allMonthsData[key] = data;
        return data;
    };

    function brandRgb() {
        const h = window.cssVar('--brand').replace('#', '');
        const n = parseInt(h, 16);
        return `${(n >> 16) & 255}, ${(n >> 8) & 255}, ${n & 255}`;
    }

    window.renderCalendarGrid = function(data) {
        const totals = Object.values(data.daily_totals).map(t => t.expense);
        const max = Math.max(0, ...totals);
        const rgb = brandRgb();
        let html = '<div class="cal-grid">';
        data.month_days.forEach(week => week.forEach((d, i) => {
            if (d === 0) { html += '<div></div>'; return; }
            const dateStr = `${data.year}-${String(data.month).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
            const t = data.daily_totals[dateStr] || {income: 0, expense: 0};
            (data.tx_by_date[dateStr] || []).forEach(tx => window.txDataStore[tx.id] = tx);
            // 지출이 클수록 진한 한 가지 색 (0이면 투명)
            const alpha = t.expense > 0 && max > 0 ? (0.08 + 0.32 * t.expense / max).toFixed(2) : 0;
            const cls = ['cal-cell', dateStr === window.todayDate ? 'today' : '', dateStr === window.selectedDate ? 'selected' : ''].join(' ');
            const dayColor = i === 0 ? 'color:var(--expense);' : i === 6 ? 'color:var(--brand);' : '';
            html += `<button type="button" class="${cls}" id="cal-cell-${dateStr}" style="background:rgba(${rgb},${alpha})" onclick="window.selectDate('${dateStr}')"
                        aria-label="${data.month}월 ${d}일${t.expense ? ' 지출 ' + won(t.expense) : ''}${t.income ? ' 수입 ' + won(t.income) : ''}">
                <span class="d" style="${dateStr === window.todayDate ? '' : dayColor}">${d}</span>
                ${t.income ? `<span class="inc">+${window.wonShort(t.income)}</span>` : ''}
                ${t.expense ? `<span class="exp">-${window.wonShort(t.expense)}</span>` : ''}
            </button>`;
        }));
        return html + '</div>';
    };

    // 현재 달 높이에 맞춰 감싸는 영역 높이를 맞춘다 (앞뒤 달이 6주여도 빈 공간이 생기지 않게)
    function fitHeight() {
        const curr = document.getElementById('slide-curr');
        document.getElementById('calendar-slider-wrapper').style.height = curr.offsetHeight + 'px';
    }

    function renderMonthSum(data) {
        let inc = 0, exp = 0;
        Object.values(data.daily_totals).forEach(t => { inc += t.income; exp += t.expense; });
        document.getElementById('cal-month-sum').innerHTML = `<span>수입 <b class="income-text">+${won(inc)}</b></span><span>지출 <b>-${won(exp)}</b></span>`;
    }

    window.selectDate = function(dateStr) {
        window.selectedDate = dateStr;
        document.querySelectorAll('#slide-curr .cal-cell').forEach(el => el.classList.toggle('selected', el.id === 'cal-cell-' + dateStr));
        document.getElementById('daily-list-title').textContent = window.getDowStr(dateStr);

        const data = window.allMonthsData[`${window.currentY}-${window.currentM}`];
        if (!data) return;
        const txs = data.tx_by_date[dateStr] || [];
        const list = document.getElementById('daily-tx-list');
        if (!txs.length) {
            list.innerHTML = `<div class="empty">이 날 기록된 내역이 없어요</div>`;
            return;
        }
        list.innerHTML = txs.map(tx => `
            <button type="button" class="list-row" onclick="window.openTxSheet({tx: window.txDataStore[${tx.id}]})">
                <span class="avatar" style="background:${window.safeColor(tx.category_color)}">${esc((tx.category || '?').slice(0, 1))}</span>
                <div class="grow">
                    <div class="title">${esc(tx.title || tx.category)}</div>
                    <div class="meta"><span class="dot" style="width:8px;height:8px;background:${window.safeColor(tx.transactor_color)}"></span>${esc(tx.transactor)} · ${esc(tx.category)} · ${tx.time}
                        ${tx.exclude_analysis ? '<span class="badge">분석제외</span>' : ''}${tx.exclude_budget ? '<span class="badge">예산제외</span>' : ''}</div>
                    ${tx.memo ? `<div class="meta" style="margin-top:2px;">${esc(tx.memo)}</div>` : ''}
                </div>
                <span class="amount ${tx.tx_type === '수입' ? 'income-text' : ''}">${tx.tx_type === '수입' ? '+' : '-'}${won(tx.amount)}</span>
            </button>`).join('');
    };

    function defaultDateFor(y, m) {
        const prefix = `${y}-${String(m).padStart(2, '0')}`;
        return window.todayDate.startsWith(prefix) ? window.todayDate : `${prefix}-01`;
    }

    function renderNeighbors() {
        const p = window.getPrevMonth(window.currentY, window.currentM);
        const n = window.getNextMonth(window.currentY, window.currentM);
        window.fetchMonthData(p.y, p.m).then(d => document.getElementById('slide-prev').innerHTML = window.renderCalendarGrid(d));
        window.fetchMonthData(n.y, n.m).then(d => document.getElementById('slide-next').innerHTML = window.renderCalendarGrid(d));
    }

    async function showMonth(y, m, keepDate) {
        window.currentY = y; window.currentM = m;
        document.getElementById('cal-month-header').textContent = `${y}년 ${m}월`;
        window.setStoredMonth(y, m);
        window.history.replaceState(window.history.state, '', `/calendar?year=${y}&month=${m}`);
        localStorage.setItem('gb_last_page', `/calendar?year=${y}&month=${m}`);
        const data = await window.fetchMonthData(y, m);
        if (!keepDate) window.selectedDate = defaultDateFor(y, m);
        document.getElementById('slide-curr').innerHTML = window.renderCalendarGrid(data);
        fitHeight();
        renderMonthSum(data);
        window.selectDate(window.selectedDate);
        renderNeighbors();
    }

    window.allMonthsData[`${window.currentY}-${window.currentM}`] = window.initialData;
    window.selectedDate = defaultDateFor(window.currentY, window.currentM);
    document.getElementById('slide-curr').innerHTML = window.renderCalendarGrid(window.initialData);
    fitHeight();
    renderMonthSum(window.initialData);
    window.selectDate(window.selectedDate);
    renderNeighbors();

    window.shiftMonth = function(dir) {
        const slider = document.getElementById('calendar-slider');
        slider.style.transition = 'transform 0.3s cubic-bezier(0.25, 0.8, 0.25, 1)';
        slider.style.transform = dir === 1 ? 'translateX(-66.666%)' : 'translateX(0%)';
        const t = dir === 1 ? window.getNextMonth(window.currentY, window.currentM) : window.getPrevMonth(window.currentY, window.currentM);
        setTimeout(async () => {
            slider.style.transition = 'none';
            slider.style.transform = 'translateX(-33.333%)';
            await showMonth(t.y, t.m, false);
        }, 300);
    };
    window.onMonthJump = (y, m) => showMonth(y, m, false);
    window.txSheetDefaultDate = () => window.selectedDate;
    window.onTxChanged = async () => { window.allMonthsData = {}; await showMonth(window.currentY, window.currentM, true); };

    const view = document.getElementById('calendar-slider-wrapper');
    let startX = 0, startY = 0, diffX = 0, isSwiping = false, isScrolling = false;
    view.addEventListener('touchstart', e => {
        startX = e.touches[0].clientX; startY = e.touches[0].clientY;
        isSwiping = true; isScrolling = false; diffX = 0;
        document.getElementById('calendar-slider').style.transition = 'none';
    }, {passive: true});
    view.addEventListener('touchmove', e => {
        if (!isSwiping) return;
        diffX = e.touches[0].clientX - startX;
        const diffY = e.touches[0].clientY - startY;
        if (!isScrolling && Math.abs(diffY) > Math.abs(diffX) && Math.abs(diffY) > 5) isScrolling = true;
        if (isScrolling) { isSwiping = false; return; }
        const percent = (diffX / view.offsetWidth) * 33.333;
        document.getElementById('calendar-slider').style.transform = `translateX(${-33.333 + percent}%)`;
    }, {passive: true});
    view.addEventListener('touchend', () => {
        if (!isSwiping) return;
        isSwiping = false;
        if (diffX < -60) window.shiftMonth(1);
        else if (diffX > 60) window.shiftMonth(-1);
        else {
            const s = document.getElementById('calendar-slider');
            s.style.transition = 'transform 0.3s ease'; s.style.transform = 'translateX(-33.333%)';
        }
    });
}
</script>
{% endblock %}
