{% extends "base.html" %}
{% block content %}
<style>
    .calendar { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
    .day { border: 1px solid var(--color-line); border-radius: 4px; padding: 4px; height: 70px; background: #fff; display: flex; flex-direction: column; cursor: pointer; transition: background-color 0.2s; overflow: hidden; }
    .day:hover, .day.active { background-color: rgba(19, 189, 126, 0.1); border-color: var(--color-primary); }
    
    .day.today { border: 2px solid var(--color-primary); background-color: rgba(19, 189, 126, 0.05); }
    .day.today .day-title { color: var(--color-action); font-size: 13px; }
    
    .day-title { font-weight: 700; font-size: 11px; margin-bottom: auto; }
    .day-inc, .day-exp { font-size: 9px; font-weight: 700; text-align: right; margin-top: 1px; white-space: nowrap; text-overflow: ellipsis; overflow: hidden; }
    .day-inc { color: var(--color-action); }
    .day-exp { color: #fe493d; }
    .tx-item { padding: 12px 0; border-bottom: 1px solid var(--color-line); display: flex; justify-content: space-between; align-items: flex-start; }
</style>

<div class="month-selector">
    <a href="/calendar?year={{ p_y }}&month={{ p_m }}">◀</a> 
    <h3>{{ t_year }}년 {{ t_month }}월 달력</h3>
    <a href="/calendar?year={{ n_y }}&month={{ n_m }}">▶</a>
</div>

<div class="card" style="padding: var(--spacing-sm);">
    <div style="display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-size: 11px; font-weight: 700; color: var(--color-muted); margin-bottom: 4px;">
        <div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div>
    </div>
    <div class="calendar" id="calendar"></div>
</div>

<div class="card" id="detail-section" style="display: none;">
    <h3 id="detail-date-title" style="font-size: 16px; font-weight: 700; margin-bottom: 12px; border-bottom: 1px solid var(--color-line); padding-bottom: 8px;">선택한 날짜</h3>
    <div id="detail-list"></div>
</div>

<script>
    {
        const dailyTotals = {{ daily_totals | tojson | safe }};
        const txByDate = {{ tx_by_date | tojson | safe }};
        const todayDate = "{{ today_date }}";
        
        const calendarEl = document.getElementById('calendar');
        const year = {{ t_year }}; const month = {{ t_month }} - 1;
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        const firstDay = new Date(year, month, 1).getDay(); 
        
        calendarEl.innerHTML = '';
        for (let i = 0; i < firstDay; i++) calendarEl.innerHTML += `<div></div>`;
        
        for (let i = 1; i <= daysInMonth; i++) {
            const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(i).padStart(2, '0')}`;
            const total = dailyTotals[dateStr] || {income: 0, expense: 0};
            let incHtml = total.income > 0 ? `<div class="day-inc">+${total.income.toLocaleString()}</div>` : '';
            let expHtml = total.expense > 0 ? `<div class="day-exp">-${total.expense.toLocaleString()}</div>` : '';
            
            const isTodayClass = (dateStr === todayDate) ? "today" : "";
            calendarEl.innerHTML += `<div class="day ${isTodayClass}" onclick="window.showDetails('${dateStr}', this)"><div class="day-title">${i}</div>${incHtml}${expHtml}</div>`;
        }

        window.showDetails = function(dateStr, element) {
            document.querySelectorAll('.day').forEach(el => el.classList.remove('active'));
            element.classList.add('active');
            document.getElementById('detail-date-title').innerText = `${dateStr} 내역`;
            document.getElementById('detail-section').style.display = 'block';
            
            const txs = txByDate[dateStr] || [];
            const detailList = document.getElementById('detail-list');
            if (txs.length === 0) {
                detailList.innerHTML = '<div style="text-align: center; color: var(--color-muted); padding: 20px 0;">이 날짜에는 내역이 없습니다.</div>';
                return;
            }

            detailList.innerHTML = txs.map(tx => {
                const color = tx.tx_type === '수입' ? 'var(--color-action)' : '#fe493d';
                const sign = tx.tx_type === '수입' ? '+' : '-';
                return `
                    <div class="tx-item">
                        <div>
                            <div style="font-size: 12px; color: var(--color-secondary); margin-bottom: 4px;">🧑 ${tx.transactor} | 🏷️ ${tx.category}</div>
                            <div style="font-weight: 700; font-size: 16px;">${tx.title}</div>
                        </div>
                        <div style="text-align: right;">
                            <div style="font-weight: 700; font-size: 16px; color: ${color};">
                                ${sign}${tx.amount.toLocaleString()}원
                            </div>
                            <div style="margin-top: 8px; display: flex; gap: 8px; justify-content: flex-end; align-items: center; line-height: 1;">
                                <a href="/transaction/${tx.id}/edit" style="font-size: 12px; color: var(--color-muted); text-decoration: none;">수정</a>
                                <span style="color: var(--color-line);">|</span>
                                <form action="/transaction/${tx.id}/delete" method="POST" style="display: flex; align-items: center; margin: 0;" onsubmit="return confirm('정말 삭제하시겠습니까?');">
                                    <button type="submit" style="background:none; border:none; color: var(--color-muted); font-size: 12px; cursor: pointer; padding: 0;">삭제</button>
                                </form>
                            </div>
                        </div>
                    </div>`;
            }).join('');
        };

        // 접속 시 오늘 날짜 활성화 및 포커스
        if (todayDate) {
            const todayEl = document.querySelector('.day.today');
            if (todayEl) {
                window.showDetails(todayDate, todayEl);
            }
        }
    }
</script>
{% endblock %}
