{% extends "base.html" %}
{% block content %}
<style>
    #home-slider-wrapper { overflow: hidden; width: 100%; position: relative; touch-action: pan-y; }
    #home-slider { display: flex; width: 300%; transform: translateX(-33.333%); will-change: transform; }
    .home-slide { width: 33.333%; flex-shrink: 0; padding: 0 4px; box-sizing: border-box; }
</style>

<div class="month-selector">
    <a href="javascript:void(0)" onclick="window.shiftHomeMonth(-1)" class="no-spa">◀</a> 
    <!-- 월 선택 다이얼로그 연동 -->
    <h3 id="home-month-header" onclick="window.openMonthPicker(window.currentHomeY || {{ t_year }}, window.currentHomeM || {{ t_month }})">{{ t_year }}년 {{ t_month }}월</h3>
    <a href="javascript:void(0)" onclick="window.shiftHomeMonth(1)" class="no-spa">▶</a>
</div>

<div id="home-slider-wrapper">
    <div id="home-slider">
        <div id="slide-home-prev" class="home-slide"></div>
        <div id="slide-home-curr" class="home-slide"></div>
        <div id="slide-home-next" class="home-slide"></div>
    </div>
</div>

<script>
    window.initialHomeData = {{ initial_data | tojson | safe }};
    window.currentHomeY = {{ t_year }};
    window.currentHomeM = {{ t_month }};
</script>

<script>
    {
        window.allHomeData = {};

        window.getPrevMonth = function(y, m) { return m === 1 ? {y: y-1, m: 12} : {y: y, m: m-1}; };
        window.getNextMonth = function(y, m) { return m === 12 ? {y: y+1, m: 1} : {y: y, m: m+1}; };

        window.fetchHomeData = async function(y, m) {
            let key = `${y}-${m}`;
            if (window.allHomeData[key]) return window.allHomeData[key];
            let res = await fetch(`/api/home_data?year=${y}&month=${m}`);
            let data = await res.json();
            window.allHomeData[key] = data;
            return data;
        };

        window.renderHomeSlide = function(data) {
            let uid = `${data.year}_${data.month}`;
            
            let budgetHtml = '';
            if(data.ledger_budget > 0 || data.monthly_expense > 0 || data.budget_status.length > 0) {
                budgetHtml += `<div style="padding-top: 16px; border-top: 1px solid var(--color-line);">`;
                
                if (data.ledger_budget > 0) {
                    let max_total = Math.max(data.monthly_expense, data.ledger_budget);
                    let colorWarning = data.monthly_expense > data.ledger_budget ? 'color: #fe493d;' : '';
                    budgetHtml += `
                        <div style="font-size: 14px; font-weight: 700; margin-bottom: 4px;">
                            전체 예산 <span style="${colorWarning}">(${data.monthly_expense.toLocaleString()} / ${data.ledger_budget.toLocaleString()})</span>
                        </div>
                        <div style="width: 100%; height: 10px; background: var(--color-line); border-radius: 4px; overflow: hidden; display: flex; margin-bottom: 16px;">
                    `;
                    for(let payer in data.payer_expense) {
                        if (max_total > 0) {
                            let pct = (data.payer_expense[payer] / max_total) * 100;
                            budgetHtml += `<div style="height: 100%; width: ${pct}%; background: ${data.payer_color_map[payer]};"></div>`;
                        }
                    }
                    budgetHtml += `</div>`;
                } else if (data.monthly_expense > 0) {
                    budgetHtml += `
                        <div style="font-size: 14px; font-weight: 700; margin-bottom: 4px;">
                            총 지출 <span style="color: var(--color-secondary);">(${data.monthly_expense.toLocaleString()})</span>
                        </div>
                        <div style="width: 100%; height: 10px; background: var(--color-line); border-radius: 4px; overflow: hidden; display: flex; margin-bottom: 16px;">
                    `;
                    for(let payer in data.payer_expense) {
                        let pct = (data.payer_expense[payer] / data.monthly_expense) * 100;
                        budgetHtml += `<div style="height: 100%; width: ${pct}%; background: ${data.payer_color_map[payer]};"></div>`;
                    }
                    budgetHtml += `</div>`;
                }
                
                let hasExtra = false;
                let extraHtml = '';
                
                data.budget_status.forEach(b => {
                    let isExceeded = b.spent > b.budget;
                    let colorStyle = (b.budget > 0 && isExceeded) ? 'color: #fe493d; font-weight: 700;' : '';
                    let max_val = Math.max(b.spent, b.budget);
                    
                    let barsHtml = '';
                    for(let payer in b.payers) {
                        if (b.spent > 0) {
                            let pct = (b.payers[payer] / (b.budget > 0 ? max_val : b.spent)) * 100;
                            barsHtml += `<div style="height: 100%; width: ${pct}%; background: ${data.payer_color_map[payer]};"></div>`;
                        }
                    }

                    let valStr = b.budget > 0 ? `${b.spent.toLocaleString()} / ${b.budget.toLocaleString()}` : `${b.spent.toLocaleString()}`;
                    let itemHtml = `
                        <div style="margin-bottom: 8px;">
                            <div style="display: flex; justify-content: space-between; font-size: 12px; color: var(--color-secondary); margin-bottom: 2px;">
                                <span>${b.name}</span>
                                <span style="${colorStyle}">${valStr}</span>
                            </div>
                            <div style="width: 100%; height: 6px; background: var(--color-line); border-radius: 3px; overflow: hidden; display: flex;">
                                ${barsHtml}
                            </div>
                        </div>
                    `;
                    
                    if (b.budget > 0) budgetHtml += itemHtml;
                    else { hasExtra = true; extraHtml += itemHtml; }
                });
                
                if (hasExtra) {
                    budgetHtml += `
                    <div id="extra-budget-wrapper-${uid}" class="slide-wrapper">
                        <div class="slide-inner">
                            <div style="border-top: 1px dashed var(--color-line); padding-top: 16px;">
                                ${extraHtml}
                            </div>
                        </div>
                    </div>
                    <div style="text-align: center; margin-top: 12px;">
                        <button type="button" class="chip" onclick="window.toggleSlide('extra-budget-wrapper-${uid}', 'budget-arrow-${uid}')" style="background: transparent; color: var(--color-secondary); border: 1px solid var(--color-line); font-size: 12px; padding: 6px 16px;">
                            예산 미설정 분류 보기 <span id="budget-arrow-${uid}" class="arrow-icon">▼</span>
                        </button>
                    </div>
                    `;
                }

                let payers = Object.keys(data.payer_color_map);
                if(payers.length > 0) {
                    budgetHtml += `
                    <div style="display: flex; flex-wrap: wrap; gap: 12px; margin-top: 24px; margin-bottom: 4px; justify-content: center; align-items: center; background: rgba(0,0,0,0.02); padding: 10px 12px; border-radius: 8px;">
                        <span style="font-size: 12px; font-weight: 700; color: var(--color-secondary); margin-right: 4px;">참여자</span>`;
                    payers.forEach(payer => {
                        budgetHtml += `
                        <div style="display: flex; align-items: center; gap: 6px;">
                            <div style="width: 12px; height: 12px; border-radius: 3px; background: ${data.payer_color_map[payer]};"></div>
                            <span style="font-size: 12px; color: var(--color-foreground); font-weight: 600;">${payer}</span>
                        </div>`;
                    });
                    budgetHtml += `</div>`;
                }
                
                budgetHtml += `</div>`;
            }

            let html = `
                <div class="card">
                    <h2 style="font-size: 18px; font-weight: 700; margin-bottom: 16px;">이번 달 요약</h2>
                    <div style="display: flex; gap: 12px; margin-bottom: 16px;">
                        <div style="flex: 1; padding: 16px; background: rgba(19, 189, 126, 0.05); border-radius: var(--radius-action);">
                            <div style="font-size: 14px; color: var(--color-secondary);">총 수입</div>
                            <div style="font-size: 18px; font-weight: 700; color: var(--color-action);">+${data.monthly_income.toLocaleString()}원</div>
                        </div>
                        <div style="flex: 1; padding: 16px; background: rgba(254, 73, 61, 0.05); border-radius: var(--radius-action);">
                            <div style="font-size: 14px; color: var(--color-secondary);">총 지출</div>
                            <div style="font-size: 18px; font-weight: 700; color: #fe493d;">-${data.monthly_expense.toLocaleString()}원</div>
                        </div>
                    </div>
                    ${budgetHtml}
                </div>
                
                <div class="card">
                    <h3 style="font-size: 18px; font-weight: 700; margin-bottom: 16px;">지출 분석</h3>
                    <div style="margin-bottom: 32px;">
                        <h4 style="font-size: 14px; font-weight: 500; color: var(--color-secondary); margin-bottom: 8px; text-align: center;">요일별 지출 누적 그래프</h4>
                        <div style="max-width: 100%;">
                            <canvas id="dowChart_${uid}"></canvas>
                        </div>
                    </div>
                    <div style="display: flex; justify-content: center;">
                        <div style="width: 100%; max-width: 320px;">
                            <h4 style="font-size: 14px; font-weight: 500; color: var(--color-secondary); margin-bottom: 12px; text-align: center;">카테고리별 지출 비율</h4>
                            <canvas id="categoryChart_${uid}"></canvas>
                        </div>
                    </div>
                </div>
            `;
            return html;
        };

        window.initHomeCharts = function(data) {
            let uid = `${data.year}_${data.month}`;
            if(window.appCharts && window.appCharts['dow_'+uid]) window.appCharts['dow_'+uid].destroy();
            if(window.appCharts && window.appCharts['cat_'+uid]) window.appCharts['cat_'+uid].destroy();
            
            const themeColors = ['#13bd7e', '#ff9f43', '#0abde3', '#f368e0', '#ff6b6b', '#feca57', '#5f27cd', '#48dbfb', '#ff9ff3', '#10ac84'];
            // 색상은 카테고리의 고정 순서(sort_order) 기준 인덱스로 배정한다.
            // 그 달에 지출이 없는 카테고리는 필터링되지만, 색 인덱스는 전체 목록 기준 위치를 그대로 쓰기 때문에
            // 활성 카테고리 구성이 달마다 달라져도 같은 카테고리는 항상 같은 색을 유지한다.
            const allCatNames = Object.keys(data.cat_expense_total);
            const activeCats = allCatNames.filter(k => data.cat_expense_total[k] > 0);
            const catDataArr = activeCats.map(k => data.cat_expense_total[k]);
            const catColors = activeCats.map(k => themeColors[allCatNames.indexOf(k) % themeColors.length]);
            
            const dowLabels = ['월', '화', '수', '목', '금', '토', '일'];
            const datasets = activeCats.map((cat, i) => { return { label: cat, data: data.dow_expense_by_cat[cat], backgroundColor: catColors[i] }; });
            
            const dowEl = document.getElementById('dowChart_'+uid);
            if(dowEl) {
                window.appCharts = window.appCharts || {};
                window.appCharts['dow_'+uid] = new Chart(dowEl, { type: 'bar', data: { labels: dowLabels, datasets: datasets }, options: { scales: { x: { stacked: true }, y: { stacked: true, beginAtZero: true, display: false } }, plugins: { legend: { position: 'bottom', labels: { boxWidth: 12 } } } } });
            }
            
            const catEl = document.getElementById('categoryChart_'+uid);
            if(catEl) {
                window.appCharts['cat_'+uid] = new Chart(catEl, { type: 'pie', data: { labels: activeCats, datasets: [{ data: catDataArr, backgroundColor: catColors, borderWidth: 0 }] }, options: { plugins: { legend: { position: 'bottom' } } } });
            }
        };

        window.allHomeData[`${window.currentHomeY}-${window.currentHomeM}`] = window.initialHomeData;
        document.getElementById('slide-home-curr').innerHTML = window.renderHomeSlide(window.initialHomeData);
        window.initHomeCharts(window.initialHomeData);
        
        let p = window.getPrevMonth(window.currentHomeY, window.currentHomeM);
        let n = window.getNextMonth(window.currentHomeY, window.currentHomeM);
        window.fetchHomeData(p.y, p.m).then(d => { document.getElementById('slide-home-prev').innerHTML = window.renderHomeSlide(d); window.initHomeCharts(d); });
        window.fetchHomeData(n.y, n.m).then(d => { document.getElementById('slide-home-next').innerHTML = window.renderHomeSlide(d); window.initHomeCharts(d); });

        window.shiftHomeMonth = async function(dir) {
            let slider = document.getElementById('home-slider');
            slider.style.transition = 'transform 0.3s cubic-bezier(0.25, 0.8, 0.25, 1)';
            slider.style.transform = dir === 1 ? `translateX(-66.666%)` : `translateX(0%)`;
            
            if (dir === 1) {
                let n = window.getNextMonth(window.currentHomeY, window.currentHomeM);
                window.currentHomeY = n.y; window.currentHomeM = n.m;
            } else {
                let p = window.getPrevMonth(window.currentHomeY, window.currentHomeM);
                window.currentHomeY = p.y; window.currentHomeM = p.m;
            }
            
            document.getElementById('home-month-header').innerText = `${window.currentHomeY}년 ${window.currentHomeM}월`;
            
            setTimeout(async () => {
                slider.style.transition = 'none';
                slider.style.transform = `translateX(-33.333%)`;
                
                let data = await window.fetchHomeData(window.currentHomeY, window.currentHomeM);
                document.getElementById('slide-home-curr').innerHTML = window.renderHomeSlide(data);
                window.initHomeCharts(data);
                
                let p = window.getPrevMonth(window.currentHomeY, window.currentHomeM);
                let n = window.getNextMonth(window.currentHomeY, window.currentHomeM);
                window.fetchHomeData(p.y, p.m).then(d => { document.getElementById('slide-home-prev').innerHTML = window.renderHomeSlide(d); window.initHomeCharts(d); });
                window.fetchHomeData(n.y, n.m).then(d => { document.getElementById('slide-home-next').innerHTML = window.renderHomeSlide(d); window.initHomeCharts(d); });
                
                window.history.replaceState(null, '', `/home?year=${window.currentHomeY}&month=${window.currentHomeM}`);
            }, 300);
        };

        // 개선: 수직 스크롤 간섭 방지를 위한 임계값(Threshold) 로직 적용
        const view = document.getElementById('home-slider-wrapper');
        let startX = 0, startY = 0, diffX = 0, isSwiping = false, isScrolling = false;
        
        view.addEventListener('touchstart', e => {
            startX = e.touches[0].clientX;
            startY = e.touches[0].clientY;
            isSwiping = true;
            isScrolling = false;
            diffX = 0;
            document.getElementById('home-slider').style.transition = 'none';
        }, {passive: true});
        
        view.addEventListener('touchmove', e => {
            if(!isSwiping) return;
            let currentX = e.touches[0].clientX;
            let currentY = e.touches[0].clientY;
            diffX = currentX - startX;
            let diffY = currentY - startY;
            
            // 처음 움직일 때 Y축 변화량이 크면 수직 스크롤로 판정하여 스와이프 차단
            if (!isScrolling && Math.abs(diffY) > Math.abs(diffX) && Math.abs(diffY) > 5) {
                isScrolling = true;
            }
            if (isScrolling) {
                isSwiping = false;
                return;
            }
            
            let cw = view.offsetWidth;
            let percent = (diffX / cw) * 33.333;
            document.getElementById('home-slider').style.transform = `translateX(${-33.333 + percent}%)`;
        }, {passive: true});
        
        view.addEventListener('touchend', e => {
            if(!isSwiping) return;
            isSwiping = false;
            if (diffX < -60) window.shiftHomeMonth(1);
            else if (diffX > 60) window.shiftHomeMonth(-1);
            else {
                document.getElementById('home-slider').style.transition = 'transform 0.3s ease';
                document.getElementById('home-slider').style.transform = 'translateX(-33.333%)';
            }
        });
    }
</script>
{% endblock %}
