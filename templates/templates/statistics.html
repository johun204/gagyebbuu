{% extends "base.html" %}
{% block content %}
<div class="card">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--spacing-base); flex-wrap: wrap; gap: 12px;">
        <h2 style="font-size: 20px; font-weight: 700;">
            통계 
            <span style="font-size: 16px; font-weight: 400; color: var(--color-secondary);">
                ({% if period == 'week' %}이번 주{% elif period == 'year' %}올해{% else %}이번 달{% endif %})
            </span>
        </h2>
        <div style="display: flex; gap: 8px;">
            <a href="/statistics?period=week" class="chip" {% if period == 'week' %}style="background: var(--color-primary); color: #fff;"{% endif %}>이번 주</a>
            <a href="/statistics?period=month" class="chip" {% if period == 'month' %}style="background: var(--color-primary); color: #fff;"{% endif %}>이번 달</a>
            <a href="/statistics?period=year" class="chip" {% if period == 'year' %}style="background: var(--color-primary); color: #fff;"{% endif %}>올해</a>
        </div>
    </div>

    <div style="max-width: 360px; margin: 20px auto;">
        <canvas id="categoryChart"></canvas>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
    const categoryTotals = {{ category_totals | tojson | safe }};
    const labels = Object.keys(categoryTotals);
    const data = Object.values(categoryTotals);
    
    const backgroundColors = labels.map((_, i) => `hsl(${i * 360 / labels.length}, 70%, 60%)`);
    
    const ctx = document.getElementById('categoryChart').getContext('2d');
    new Chart(ctx, {
        type: 'pie',
        data: {
            labels: labels,
            datasets: [{
                data: data,
                backgroundColor: backgroundColors
            }]
        },
        options: {
            responsive: true,
            plugins: {
                legend: { position: 'bottom' },
                tooltip: {
                    callbacks: {
                        label: function(context) {
                            return context.label + ': ' + context.raw.toLocaleString() + '원';
                        }
                    }
                }
            }
        }
    });
</script>
{% endblock %}
