<html lang="ko">

    <meta property="og:description" content="{{ og_desc|default('부부가 함께 쓰는 귀여운 가계부, 수입과 지출을 쉽고 투명하게 관리해보세요.') }}">

    <meta property="og:url" content="{{ request.url }}">

    <link rel="apple-touch-icon" href="/static/icon-192.png">

    <script>
        const originalFetch = window.fetch;
        window.fetch = async function(...args) {
            let [resource, config] = args;
            config = config || {};
            const headers = new Headers(config.headers || {});
            
            const token = localStorage.getItem('jwt_token');
            if (token) headers.set('Authorization', 'Bearer ' + token);
            headers.set('X-Requested-With', 'XMLHttpRequest');
            
            config.headers = headers;
            
            const maxRetries = 4;
            let attempt = 0;
            let delay = 500; 

            while (attempt <= maxRetries) {
                try {
                    const response = await originalFetch(resource, config);
                    
                    if (response.status === 401 && !window.location.pathname.startsWith('/login')) {
                        localStorage.removeItem('jwt_token');
                        window.location.href = '/login';
                        return Promise.reject('Unauthorized');
                    }
                    
                    if (response.status >= 500) {
                        if (attempt < maxRetries) {
                            attempt++;
                            await new Promise(resolve => setTimeout(resolve, delay));
                            delay *= 2; 
                            continue;
                        } else {
                            const errorDialog = document.getElementById('db-error-dialog');
                            if (errorDialog && !errorDialog.open) {
                                errorDialog.showModal();
                            }
                            return Promise.reject('Server Error');
                        }
                    }
                    return response;
                    
                } catch (error) {
                    if (attempt < maxRetries) {
                        attempt++;
                        await new Promise(resolve => setTimeout(resolve, delay));
                        delay *= 2;
                        continue;
                    } else {
                        const errorDialog = document.getElementById('db-error-dialog');
                        if (errorDialog && !errorDialog.open) {
                            errorDialog.showModal();
                        }
                        throw error;
                    }
                }
            }
        };
    </script>
    
    <style>
        :root {
            --color-primary: #22B57F; --color-action: #17945F; --color-danger: #F0685A; --color-canvas: #ffffff;
            --color-foreground: #111111; --color-secondary: #555c68; --color-muted: #9fa4b0; --color-line: #f0f2f5;
            --font-sans: Pretendard, -apple-system, BlinkMacSystemFont, system-ui, "Segoe UI", Roboto, sans-serif;
            --spacing-sm: 8px; --spacing-md: 12px; --spacing-base: 16px; --spacing-lg: 24px;
            --radius-chip: 16px; --radius-action: 16px; --radius-card: 24px; --radius-full: 9999px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: var(--font-sans); background-color: var(--color-canvas); color: var(--color-foreground); line-height: 1.5;
            padding: var(--spacing-base); padding-bottom: 130px;
            padding-top: calc(env(safe-area-inset-top) + var(--spacing-lg));
            max-width: 768px; margin: 0 auto;
        }

        #nprogress { position: fixed; top: env(safe-area-inset-top); left: 0; right: 0; height: 3px; background: var(--color-action); z-index: 9999; transform: scaleX(0); transform-origin: left; transition: transform 0.2s ease; }

        .bottom-nav { 
            position: fixed; bottom: 0; left: 0; right: 0; 
            background-color: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); 
            border-top: 1px solid var(--color-line); display: flex; justify-content: space-around; align-items: center; 
            z-index: 1000; 
            padding-bottom: calc(env(safe-area-inset-bottom) + 16px); padding-top: 10px; 
            box-sizing: content-box; 
        }
        .bottom-nav a { text-decoration: none; color: var(--color-muted); font-size: 12px; font-weight: 500; display: flex; flex-direction: column; align-items: center; gap: 4px; flex: 1; text-align: center; }
        .bottom-nav a.active { color: var(--color-foreground); font-weight: 700; }
        .nav-icon { width: 22px; height: 22px; }
        .nav-link.active .nav-icon { stroke-width: 2.4; }

        .btn-action { display: inline-flex; align-items: center; justify-content: center; background-color: var(--color-action); color: var(--color-canvas); border-radius: var(--radius-action); padding: 12px 20px; font-size: 16px; font-weight: 700; border: none; cursor: pointer; text-decoration: none; flex-shrink: 0; }
        .chip { display: inline-flex; align-items: center; justify-content: center; background-color: rgba(34, 181, 127, 0.15); color: var(--color-primary); border-radius: var(--radius-chip); padding: 6px 12px; font-size: 14px; font-weight: 500; border: none; text-decoration: none; cursor: pointer; flex-shrink: 0; }
        .card { background-color: var(--color-canvas); border: 1px solid var(--color-line); border-radius: var(--radius-card); padding: var(--spacing-lg); margin-bottom: var(--spacing-lg); }
        .input-field, select { background-color: var(--color-canvas); border: 1px solid var(--color-line); border-radius: var(--radius-action); padding: 12px 16px; font-size: 16px; color: var(--color-foreground); outline: none; font-family: var(--font-sans); width: 100%; box-sizing: border-box; min-width: 0; }
        .input-field:focus, select:focus { border-color: var(--color-primary); }
        
        .flex-row { display: flex; gap: var(--spacing-sm); align-items: center; flex-wrap: wrap; margin-bottom: var(--spacing-md); }
        .flex-row > .input-wrapper { flex: 1 1 130px; box-sizing: border-box; min-width: 0; }
        
        .month-selector { display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--spacing-base); }
        .month-selector h3 { font-size: 20px; font-weight: 700; cursor: pointer; padding: 4px 12px; }
        .month-selector a { text-decoration: none; color: var(--color-foreground); padding: 8px 10px; display: inline-flex; align-items: center; }
        .month-arrow-icon { width: 20px; height: 20px; }

        dialog { border: 1px solid var(--color-line); border-radius: var(--radius-card); padding: 24px; width: 90%; max-width: 400px; margin: auto; background: var(--color-canvas); box-shadow: 0 17px 50px rgba(0,0,0,.19); box-sizing: border-box; }
        dialog::backdrop { background: rgba(17, 17, 17, 0.4); }
        dialog input[type="time"], dialog input[type="date"], dialog input[type="month"] { width: 100%; box-sizing: border-box; -webkit-appearance: none; appearance: none; }

        .skeleton { background: #e0e0e0; background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: 4px; }
        @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
        .skeleton-text { height: 20px; margin-bottom: 12px; width: 100%; }
        .skeleton-text.short { width: 50%; }
        .skeleton-circle { width: 40px; height: 40px; border-radius: 50%; }

        .slide-wrapper { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 0.3s ease, margin-top 0.3s ease, opacity 0.3s ease; opacity: 0; margin-top: 0; }
        .slide-wrapper.open { grid-template-rows: 1fr; opacity: 1; margin-top: 16px; }
        .slide-inner { overflow: hidden; }
        .arrow-icon { display: inline-block; transition: transform 0.3s ease; }
        .arrow-icon.open { transform: rotate(180deg); }

        .toast-container { position: fixed; top: calc(env(safe-area-inset-top) + 16px); left: 50%; transform: translateX(-50%); z-index: 10000; display: flex; flex-direction: column; gap: 8px; align-items: center; width: 90%; max-width: 400px; pointer-events: none; }
        .toast { background: var(--color-foreground); color: #fff; padding: 12px 20px; border-radius: var(--radius-action); font-size: 14px; font-weight: 600; text-align: center; box-shadow: 0 8px 24px rgba(0,0,0,.18); opacity: 0; transform: translateY(-12px); transition: opacity .25s ease, transform .25s ease; }
        .toast.show { opacity: 1; transform: translateY(0); }
        .toast.toast-success { background: var(--color-action); }
        .toast.toast-error { background: var(--color-danger); }

        .toggle-switch { position: relative; display: inline-block; width: 48px; height: 28px; flex-shrink: 0; }
        .toggle-switch input { opacity: 0; width: 0; height: 0; }
        .toggle-slider { position: absolute; inset: 0; background-color: var(--color-line); transition: .2s; border-radius: 999px; cursor: pointer; }
        .toggle-slider::before { position: absolute; content: ""; height: 22px; width: 22px; left: 3px; bottom: 3px; background-color: #fff; transition: .2s; border-radius: 50%; box-shadow: 0 1px 3px rgba(0,0,0,.2); }
        .toggle-switch input:checked + .toggle-slider { background-color: var(--color-action); }
        .toggle-switch input:checked + .toggle-slider::before { transform: translateX(20px); }
        .toggle-switch input:disabled + .toggle-slider { opacity: .5; cursor: not-allowed; }
    </style>
</head>
<body>
    <div id="nprogress"></div>
    <div id="toast-container" class="toast-container"></div>

    <!-- 화면 콘텐츠(#app-content)가 파싱되면서 곧바로 실행되는 인라인 스크립트가 있어서
         (예: calendar.html의 초기 selectDate 호출), 여기서 쓰는 공용 함수는
         #app-content보다 먼저 정의되어야 한다. 나머지 앱 셸 스크립트는 아래쪽에 남겨둔다. -->
    <script>
        window.getDowStr = function(dateStr) {
            const days = ['일','월','화','수','목','금','토'];
            const d = new Date(dateStr + 'T00:00:00');
            return `${dateStr} (${days[d.getDay()]})`;
        };

        window.formatNumber = function(input) {
            if (!input) return;
            let val = input.value.replace(/[^0-9]/g, '');
            input.value = val === '' ? '' : parseInt(val, 10).toLocaleString();
        };

        window.showToast = function(message, type) {
            const container = document.getElementById('toast-container');
            if (!container || !message) return;
            const toast = document.createElement('div');
            toast.className = 'toast' + (type === 'error' ? ' toast-error' : type === 'success' ? ' toast-success' : '');
            toast.textContent = message;
            container.appendChild(toast);
            requestAnimationFrame(() => toast.classList.add('show'));
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 250);
            }, 2500);
        };

        window.syncTransactorGroup = function(group, value) {
            if (!group) return;
            group.querySelectorAll('.btn-tab').forEach(b => b.classList.toggle('active', b.dataset.value === value));
            const hidden = group.querySelector('input[type="hidden"][name="transactor"]');
            if (hidden) hidden.value = value;
        };

        window.setTransactor = function(btn) {
            window.syncTransactorGroup(btn.parentElement, btn.dataset.value);
        };

        {% if ledger %}
        // 부팅 화면에서 가계부 이름을 보여줄 수 있도록 캐시해둔다.
        localStorage.setItem('gb_ledger_name', {{ ledger.name | tojson }});
        {% endif %}
    </script>

    <main id="app-content">{% block content %}{% endblock %}</main>

    <div id="nav-container">
        {% if current_user_id and has_ledger %}

            <a href="/home" onclick="event.preventDefault(); window.navigateTab('/home');" class="nav-link {% if current_tab == 'home' %}active{% endif %}">

    <dialog id="global-month-picker">
        <div style="display: flex; justify-content: space-between; margin-bottom: 16px;">
            <h3 style="font-size: 18px; font-weight: 700;">월 이동</h3>
            <button type="button" class="chip" onclick="document.getElementById('global-month-picker').close()" style="background:none;">닫기</button>
        </div>
        <div class="flex-row">
            <div class="input-wrapper"><input type="month" id="global_month_input" class="input-field"></div>
        </div>
        <button type="button" class="btn-action" style="width:100%; margin-top: 12px;" onclick="window.jumpToMonth()">이동하기</button>
    </dialog>

    <dialog id="db-error-dialog">
        <div style="text-align: center; padding: 10px 0;">
            <div style="font-size: 40px; margin-bottom: 16px;">⏳</div>
            <h3 style="font-size: 18px; font-weight: 700; margin-bottom: 8px;">DB 연결 지연</h3>
            <p style="font-size: 14px; color: var(--color-secondary); margin-bottom: 24px; line-height: 1.5;">
                현재 서버 연결이 원활하지 않습니다.<br>아래 버튼을 눌러 다시 시도해주세요.
            </p>
            <button type="button" class="btn-action" style="width: 100%;" onclick="document.getElementById('db-error-dialog').close(); window.location.reload();">새로고침 시도하기</button>
        </div>
    </dialog>

    <script>
        // 탭(홈/달력/내역) 간에 마지막으로 보던 연/월을 공유하기 위한 저장소.
        // 없으면(=null) "오늘"을 의미한다.
        window.MONTH_TABS = ['/home', '/calendar', '/transactions'];

        window.getStoredMonth = function() {
            const v = localStorage.getItem('gb_selected_ym');
            if (!v) return null;
            const [y, m] = v.split('-').map(Number);
            if (!y || !m) return null;
            return { y, m };
        };

        window.setStoredMonth = function(y, m) {
            localStorage.setItem('gb_selected_ym', `${y}-${m}`);
        };

        window.clearStoredMonth = function() {
            localStorage.removeItem('gb_selected_ym');
        };

        // 마지막으로 보던 탭/페이지를 기억해서, PWA 아이콘 실행 등 start_url("/")로
        // 새로 진입할 때 그 페이지부터 이어서 보여줄 수 있도록 한다 (bootstrap.html에서 사용).
        const REMEMBERED_PREFIXES = ['/home', '/calendar', '/transactions', '/settings', '/mypage'];
        function saveLastPage(pathWithSearch) {
            const path = pathWithSearch.split('?')[0];
            const ok = path === '/' || REMEMBERED_PREFIXES.some(p => path === p || path.startsWith(p + '/'));
            if (ok) localStorage.setItem('gb_last_page', pathWithSearch);
        }

        // 하단 네비게이션 클릭 처리: 다른 탭으로 이동하면 저장된 연/월을 그대로 이어서 보여주고,
        // 이미 보고 있는 탭을 다시 누르면 오늘 날짜로 초기화한다.
        window.navigateTab = function(basePath) {
            const currentPath = window.location.pathname === '/' ? '/home' : window.location.pathname;
            if (currentPath === basePath) {
                window.clearStoredMonth();
                navigate(basePath);
                return;
            }
            const stored = window.MONTH_TABS.includes(basePath) ? window.getStoredMonth() : null;
            navigate(stored ? `${basePath}?year=${stored.y}&month=${stored.m}` : basePath);
        };

        window.openMonthPicker = function(currentY, currentM) {
            let mStr = currentM.toString().padStart(2, '0');
            document.getElementById('global_month_input').value = `${currentY}-${mStr}`;
            document.getElementById('global-month-picker').showModal();
        };

        window.jumpToMonth = function() {
            let val = document.getElementById('global_month_input').value;
            if(!val) return;
            let parts = val.split('-');
            let path = window.location.pathname;
            document.getElementById('global-month-picker').close();
            window.setStoredMonth(parseInt(parts[0], 10), parseInt(parts[1], 10));
            navigate(`${path}?year=${parts[0]}&month=${parseInt(parts[1], 10)}`);
        };

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js').catch(err => console.log('SW registration failed:', err));
            });
        }

        window.toggleSlide = function(wrapperId, arrowId) {
            const wrapper = document.getElementById(wrapperId);
            const arrow = document.getElementById(arrowId);
            if(wrapper) wrapper.classList.toggle('open');
            if(arrow) arrow.classList.toggle('open');
        };

        const skeletonHome = `
            <div class="skeleton skeleton-text short" style="height:14px; margin:0 auto 4px; width:80px;"></div>
            <div class="month-selector"><a href="#" class="no-spa" style="visibility:hidden;"><svg class="month-arrow-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg></a><h3><div class="skeleton skeleton-text short" style="margin:0 auto;height:24px;"></div></h3><a href="#" class="no-spa" style="visibility:hidden;"><svg class="month-arrow-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg></a></div>
            <div class="card">
                <h2 style="font-size: 18px; font-weight: 700; margin-bottom: 16px;">이번 달 요약</h2>
                <div style="display: flex; gap: 12px; margin-bottom: 16px;">
                    <div class="skeleton" style="flex:1; height:76px; border-radius:16px;"></div><div class="skeleton" style="flex:1; height:76px; border-radius:16px;"></div>
                </div>
                <div style="padding-top: 16px; border-top: 1px solid var(--color-line);">
                    <div class="skeleton skeleton-text short" style="height:14px; margin-bottom: 4px;"></div>
                    <div class="skeleton" style="width: 100%; height: 10px; border-radius: 4px; margin-bottom: 16px;"></div>
                    <div style="display: flex; justify-content: space-between; margin-bottom: 2px;"><div class="skeleton skeleton-text" style="width: 20%; height:12px;"></div><div class="skeleton skeleton-text" style="width: 30%; height:12px;"></div></div>
                    <div class="skeleton" style="width: 100%; height: 6px; border-radius: 3px; margin-bottom: 8px;"></div>
                </div>
            </div>
            <div class="card">
                <h3 style="font-size: 18px; font-weight: 700; margin-bottom: 16px;">지출 분석</h3>
                <div class="skeleton" style="width:100%; height:260px; border-radius:8px; margin-bottom: 16px;"></div>
                <div class="skeleton" style="width:100%; height:220px; border-radius:8px; margin-bottom: 16px;"></div>
                <div class="skeleton" style="width:100%; max-width:300px; height:300px; border-radius:50%; margin: 0 auto;"></div>
            </div>
        `;

        const skeletonCalendar = `
            <div class="month-selector"><a href="#" class="no-spa" style="visibility:hidden;"><svg class="month-arrow-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg></a><h3><div class="skeleton skeleton-text short" style="margin:0 auto;height:24px;"></div></h3><a href="#" class="no-spa" style="visibility:hidden;"><svg class="month-arrow-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg></a></div>
            <div class="card" style="padding: 16px; margin-bottom: 8px;">
                <div style="display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; margin-bottom: 12px; font-size:12px; font-weight:700;"><div style="color: var(--color-danger);">일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div style="color: #3FADD6;">토</div></div>
                <div style="display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; row-gap: 8px;">
                    ${Array(35).fill('<div class="skeleton" style="min-height:50px; border-radius:4px;"></div>').join('')}
                </div>
            </div>
            <div class="card" style="padding: 16px;"><div class="skeleton skeleton-text short" style="height:20px;"></div><div class="skeleton skeleton-text" style="height:60px;"></div></div>
        `;

        const skeletonTransactions = `
            <h2 style="font-size: 20px; font-weight: 700; margin-bottom: var(--spacing-lg);">내역 검색</h2>
            <div class="card" style="margin-bottom: 8px;">
                <div style="display: flex; gap: 8px; margin-bottom: 12px;"><div class="skeleton" style="flex: 1; height: 40px; border-radius: 8px;"></div><div class="skeleton" style="flex: 1; height: 40px; border-radius: 8px;"></div><div class="skeleton" style="flex: 1; height: 40px; border-radius: 8px;"></div></div>
                <div class="skeleton" style="height: 44px; border-radius: 16px; margin-bottom: 12px;"></div>
                <div style="display: flex; gap: 8px;"><div class="skeleton" style="flex: 1; height: 40px; border-radius: 8px;"></div><div class="skeleton" style="flex: 1; height: 40px; border-radius: 8px;"></div></div>
            </div>
            <div class="skeleton-card" style="padding: 16px;"><div class="skeleton skeleton-text short"></div><div class="skeleton" style="height:50px; border-radius:8px;"></div></div>
        `;

        const skeletonSettings = `
            <h2 style="font-size: 20px; font-weight: 700; margin-bottom: var(--spacing-lg);">설정</h2>
            <div class="card"><div class="skeleton" style="height:56px; border-radius:16px;"></div></div>
            <div class="card"><div class="skeleton" style="height:56px; border-radius:16px;"></div></div>
            <div class="card"><h3 style="font-size: 16px; font-weight: 700; margin-bottom: 16px;">예산 설정</h3><div class="skeleton" style="height:150px; border-radius:16px;"></div></div>
        `;

        const skeletonMypage = `
            <div class="skeleton skeleton-text short" style="height:14px; margin-bottom: var(--spacing-lg);"></div>
            <h2 style="font-size: 20px; font-weight: 700; margin-bottom: var(--spacing-lg);">마이페이지</h2>
            <div class="card"><div class="skeleton" style="height:48px; border-radius:16px;"></div></div>
            <div class="card"><div class="skeleton" style="height:48px; border-radius:16px; margin-bottom:8px;"></div><div class="skeleton" style="height:48px; border-radius:16px;"></div></div>
            <div class="card"><div class="skeleton" style="height:48px; border-radius:16px;"></div></div>
            <div class="card"><div class="skeleton" style="height:80px; border-radius:16px;"></div></div>
            <div class="card"><div class="skeleton" style="height:48px; border-radius:16px;"></div></div>
        `;

        const skeletonOnboarding = `
            <h2 style="text-align: center; margin-top: 40px;">가계부 시작하기</h2>
            <div class="card"><div class="skeleton" style="height:44px; border-radius:16px; margin-bottom:16px;"></div><div class="skeleton" style="height:48px; border-radius:16px;"></div></div>
            <div class="card"><div class="skeleton" style="height:44px; border-radius:16px; margin-bottom:16px;"></div><div class="skeleton" style="height:48px; border-radius:16px;"></div></div>
        `;

        function getSkeletonHtml(urlStr) {
            let path = '';
            try { path = new URL(urlStr, window.location.origin).pathname; } catch(e) { path = urlStr; }
            if (path.includes('calendar')) return skeletonCalendar;
            if (path.includes('transactions')) return skeletonTransactions;
            if (path.includes('mypage')) return skeletonMypage;
            if (path.includes('settings')) return skeletonSettings;
            if (path.includes('onboarding') || path.includes('login')) return skeletonOnboarding;
            return skeletonHome;
        }

        // DOM 적용 헬퍼: 캐시 렌더링 및 최종 네트워크 업데이트 시 사용 (중복코드 최소화)
        function applyDOM(html, url, push) {
            const parser = new DOMParser();
            const doc = parser.parseFromString(html, 'text/html');
            
            document.title = doc.title;
            if(window.appCharts) Object.values(window.appCharts).forEach(c => c && c.destroy());
            if(window.txObserver) window.txObserver.disconnect();
            
            document.getElementById('app-content').innerHTML = doc.getElementById('app-content').innerHTML;
            
            const docNav = doc.getElementById('nav-container');
            if(docNav) document.getElementById('nav-container').innerHTML = docNav.innerHTML;

            if(push) window.history.pushState({path: url}, '', url);
            saveLastPage(window.location.pathname + window.location.search);

            document.querySelectorAll('.bottom-nav a').forEach(a => {
                a.classList.remove('active');
                if (a.getAttribute('href').split('?')[0] === window.location.pathname) a.classList.add('active');
            });

            const scripts = document.getElementById('app-content').querySelectorAll('script');
            scripts.forEach(s => {
                const newScript = document.createElement('script');
                Array.from(s.attributes).forEach(attr => newScript.setAttribute(attr.name, attr.value));
                newScript.appendChild(document.createTextNode(s.innerHTML));
                s.parentNode.replaceChild(newScript, s);
            });
        }

        async function navigate(url, pushState = true) {
            const bar = document.getElementById('nprogress');
            bar.style.transition = 'transform 0.2s ease';
            bar.style.transform = 'scaleX(0.4)';
            
            document.getElementById('app-content').innerHTML = getSkeletonHtml(url);

            // 오프라인/캐시 응답은 Service Worker(sw.js)의 fetch 핸들러가 이 fetch() 호출을
            // 가로채서 처리한다 (네트워크 실패 시 캐시 응답 반환). 페이지 쪽에서 별도로
            // caches.match/put을 하면 SW 캐시와 이름이 어긋나 서로 지워버리는 문제가 있어 제거함.
            try {
                const response = await fetch(url);

                if (response.url && response.url.includes('/login') && !window.location.pathname.includes('/login')) {
                    localStorage.removeItem('jwt_token');
                    window.location.href = '/login';
                    return;
                }

                const html = await response.text();
                applyDOM(html, url, pushState);
            } catch (err) {
                if (err === 'Server Error') {
                    if (bar) bar.style.transform = 'scaleX(0)';
                    return;
                }
                window.location.href = url; 
            } 
            finally { bar.style.transform = 'scaleX(1)'; setTimeout(() => { bar.style.transition = 'none'; bar.style.transform = 'scaleX(0)'; }, 300); }
        }

        window.addEventListener('popstate', (e) => { if(e.state) navigate(window.location.pathname + window.location.search, false); });
        
        document.addEventListener('click', e => { 
            if (e.defaultPrevented) return; 
            const link = e.target.closest('a'); 
            if (link && link.origin === window.location.origin && !link.classList.contains('no-spa') && !link.hasAttribute('download')) { 
                e.preventDefault(); 
                navigate(link.href); 
            } 
        });
        
        document.addEventListener('submit', async e => {
            if (e.defaultPrevented) return; 
            const form = e.target;
            if (form.classList.contains('no-spa')) return;
            e.preventDefault();
            const bar = document.getElementById('nprogress');
            bar.style.transition = 'transform 0.2s ease';
            bar.style.transform = 'scaleX(0.4)';
            
            const submitter = e.submitter;
            const formData = new FormData(form);
            if (submitter && submitter.name) {
                formData.append(submitter.name, submitter.value);
            }
            
            const actionUrl = form.getAttribute('action') || window.location.pathname;
            const methodType = (form.getAttribute('method') || 'GET').toUpperCase();
            
            const url = methodType === 'GET' ? actionUrl + '?' + new URLSearchParams(formData).toString() : actionUrl;
            
            document.getElementById('app-content').innerHTML = getSkeletonHtml(url);
            
            try {
                const response = await fetch(url, { method: methodType, body: methodType === 'POST' ? formData : null });
                
                const contentType = response.headers.get("content-type");
                if (contentType && contentType.indexOf("application/json") !== -1) {
                    const data = await response.json();
                    if (data.redirect) {
                        return navigate(data.redirect);
                    }
                } else {
                    const html = await response.text();
                    applyDOM(html, response.url, true);
                }
            } catch (err) { 
                if (err === 'Server Error') {
                    if (bar) bar.style.transform = 'scaleX(0)';
                    return;
                }
                form.submit(); 
            } 
            finally { bar.style.transform = 'scaleX(1)'; setTimeout(() => { bar.style.transition = 'none'; bar.style.transform = 'scaleX(0)'; }, 300); }
        });
    </script>
</body>
</html>
