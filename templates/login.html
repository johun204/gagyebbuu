{% extends "base.html" %}
{% block content %}
<div class="card" style="max-width: 400px; margin: 60px auto; text-align: center; padding: 40px 24px;">
    <div style="font-size: 48px; margin-bottom: 16px;">👫</div>
    <h1 style="font-size: 32px; font-weight: 800; color: var(--color-primary); margin-bottom: 8px;">가계쀼</h1>
    <p style="font-size: 14px; color: var(--color-action); font-weight: 700; margin-bottom: 16px;">공유 가계부</p>
    <p style="font-size: 15px; color: var(--color-secondary); margin-bottom: 40px; line-height: 1.5; word-break: keep-all;">
        부부가 함께 쓰는 귀여운 가계부,<br>수입과 지출을 쉽고 투명하게 관리해보세요.
    </p>
    
    <div style="border-top: 1px solid var(--color-line); margin-bottom: 24px;"></div>
    
    <h2 style="font-size: 14px; font-weight: 600; color: var(--color-muted); margin-bottom: 16px;">로그인하여 시작하기</h2>
    <a href="https://kauth.kakao.com/oauth/authorize?client_id={{ client_id }}&redirect_uri={{ redirect_uri }}&response_type=code" class="btn-action no-spa" style="width: 100%; background-color: #fee500; color: #111111;">
        카카오로 시작하기
    </a>
</div>
{% endblock %}
