{% extends "base.html" %}
{% block content %}
<h2 style="font-size: 20px; font-weight: 700; margin-bottom: var(--spacing-lg);">설정</h2>

<a href="/mypage" class="card" style="display: flex; justify-content: space-between; align-items: center; text-decoration: none; color: inherit;">
    <div>
        <h3 style="font-size: 16px; font-weight: 700; margin-bottom: 4px;">마이페이지</h3>
        <p style="font-size: 13px; color: var(--color-secondary);">{{ current_user.nickname }} · {{ ledger.name }}</p>
    </div>
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--color-muted)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
</a>

<div class="card">
    <div style="display: flex; justify-content: space-between; align-items: center; gap: 16px;">
        <div>
            <h3 style="font-size: 16px; font-weight: 700; margin-bottom: 4px;">푸시 알림</h3>
            <p style="font-size: 13px; color: var(--color-secondary);">상대방이 거래를 등록·수정·삭제하면 알림을 받아요.</p>
        </div>
        <label class="toggle-switch">
            <input type="checkbox" id="push-toggle-input" onchange="window.togglePushSubscription()">
            <span class="toggle-slider"></span>
        </label>
    </div>
</div>

<div class="card">
    <h3 style="font-size: 16px; font-weight: 700; margin-bottom: 16px;">예산 설정</h3>
    <form action="/set_budget" method="POST" onsubmit="return window.validateAndConfirmBudget()">
        <div style="margin-bottom: 20px;">
            <label style="font-size: 14px; font-weight: 700;">전체 월 예산 (원)</label>
            <input type="text" inputmode="numeric" id="total_budget" name="total_budget" class="input-field" value="{{ '{:,}'.format(ledger.monthly_budget) if ledger.monthly_budget else '' }}" style="margin-top: 4px;" oninput="window.formatNumber(this)">
        </div>
        <label style="font-size: 14px; font-weight: 700; display: block; margin-bottom: 8px;">카테고리별 예산 (선택)</label>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px;">
            {% for cat in categories if cat.name != '미분류' %}
            <div style="background: var(--color-canvas); border: 1px solid var(--color-line); padding: 12px; border-radius: var(--radius-action);">
                <div style="font-size: 13px; font-weight: 600; margin-bottom: 6px; color: var(--color-secondary);">{{ cat.name }}</div>
                <input type="text" inputmode="numeric" class="input-field cat-budget" name="cat_budget_{{ cat.id }}" value="{{ '{:,}'.format(cat.budget) if cat.budget else '' }}" style="padding: 8px 10px; font-size: 14px;" oninput="window.formatNumber(this)">
            </div>
            {% endfor %}
        </div>
        <button type="submit" class="btn-action" style="width: 100%;">예산 저장</button>
    </form>
</div>

<div style="margin-top: 24px; margin-bottom: 24px;">
    <a href="/logout" class="chip no-spa" style="color: var(--color-secondary); background: var(--color-line); text-decoration: none; display: block; text-align: center; padding: 14px; font-size: 14px; font-weight: 700; border-radius: var(--radius-action);" onclick="if(!confirm('로그아웃 하시겠습니까?')) { event.preventDefault(); return false; }">로그아웃</a>
</div>

<script>
    {
        window.validateAndConfirmBudget = function() {
            const totalStr = document.getElementById('total_budget').value.replace(/,/g, '');
            const total = parseInt(totalStr) || 0;
            let catSum = 0;
            document.querySelectorAll('.cat-budget').forEach(input => {
                const catValStr = input.value.replace(/,/g, '');
                catSum += parseInt(catValStr) || 0;
            });
            if (total > 0 && catSum > total) {
                window.showToast('카테고리 예산 합계가 전체 예산을 초과할 수 없습니다.', 'error');
                return false;
            }
            return confirm('예산을 저장하시겠습니까?');
        };

        const urlBase64ToUint8Array = (base64String) => {
            const padding = '='.repeat((4 - base64String.length % 4) % 4);
            const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
            const rawData = atob(base64);
            return Uint8Array.from([...rawData].map(c => c.charCodeAt(0)));
        };

        const getPushSubscription = async () => {
            if (!('serviceWorker' in navigator) || !('PushManager' in window)) return null;
            const reg = await navigator.serviceWorker.ready;
            return reg.pushManager.getSubscription();
        };

        const refreshPushToggle = async () => {
            const input = document.getElementById('push-toggle-input');
            if (!input) return;
            if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
                input.disabled = true;
                return;
            }
            const sub = await getPushSubscription();
            input.checked = !!sub;
        };

        window.togglePushSubscription = async function() {
            const input = document.getElementById('push-toggle-input');
            if (!input.checked) {
                const existing = await getPushSubscription();
                if (existing) {
                    await fetch('/api/push/unsubscribe', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ endpoint: existing.endpoint })
                    });
                    await existing.unsubscribe();
                    window.showToast('푸시 알림을 껐어요.');
                }
                return;
            }

            const permission = await Notification.requestPermission();
            if (permission !== 'granted') {
                window.showToast('알림 권한이 거부되었어요.', 'error');
                input.checked = false;
                return;
            }

            const keyRes = await fetch('/api/push/vapid_public_key');
            const { key } = await keyRes.json();
            if (!key) {
                window.showToast('푸시 알림이 아직 서버에 설정되지 않았어요.', 'error');
                input.checked = false;
                return;
            }

            const reg = await navigator.serviceWorker.ready;
            const sub = await reg.pushManager.subscribe({
                userVisibleOnly: true,
                applicationServerKey: urlBase64ToUint8Array(key)
            });

            await fetch('/api/push/subscribe', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(sub.toJSON())
            });

            window.showToast('푸시 알림을 켰어요.', 'success');
        };

        refreshPushToggle();
    }
</script>
{% endblock %}
