{% extends "base.html" %}
{% from '_icons.html' import icon %}
{% block content %}
<style>
    .search-box { display: flex; align-items: center; gap: 8px; background: var(--surface); border-radius: var(--r-md); padding: 4px 6px 4px 14px; box-shadow: var(--shadow); }
    .search-box .icon { color: var(--text-3); }
    .search-box input { flex: 1; min-width: 0; border: none; background: transparent; outline: none; font-size: 16px; padding: 10px 0; }
    .filter-btn { position: relative; }
    .filter-btn .count { position: absolute; top: 4px; right: 4px; min-width: 16px; height: 16px; border-radius: 8px; background: var(--brand); color: var(--on-brand); font-size: 10px; font-weight: 800; display: none; align-items: center; justify-content: center; padding: 0 4px; }
    .type-chips { display: flex; gap: 6px; margin: 12px 0; overflow-x: auto; }
    #filter-panel { display: none; }
    #filter-panel.open { display: block; }
    .summary-bar { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin: 4px 2px 10px; font-size: 13.5px; color: var(--text-2); flex-wrap: wrap; }
    .date-head { display: flex; justify-content: space-between; font-size: 13px; font-weight: 700; color: var(--text-2); padding: 14px 4px 6px; }
    .day-group { background: var(--surface); border-radius: var(--r-lg); padding: 2px 16px; box-shadow: var(--shadow); }
</style>

<div class="appbar">
    <h1>내역</h1>
    <a href="/settings" class="icon-btn" aria-label="설정">{{ icon('settings', 24) }}</a>
</div>

<form id="search-form" class="no-spa" role="search">
    <div class="search-box">
        {{ icon('search', 20) }}
        <input type="search" name="keyword" id="search_keyword" placeholder="내용·메모 검색" value="{{ init_keyword }}" enterkeyhint="search">
        <button type="button" class="icon-btn filter-btn" onclick="document.getElementById('filter-panel').classList.toggle('open')" aria-label="상세 필터">{{ icon('sliders', 22) }}<span class="count" id="filter-count"></span></button>
    </div>

    <div class="type-chips" role="group" aria-label="구분">
        <button type="button" class="chip" data-type="" onclick="window.setSearchTxType('')">전체</button>
        <button type="button" class="chip" data-type="지출" onclick="window.setSearchTxType('지출')">지출</button>
        <button type="button" class="chip" data-type="수입" onclick="window.setSearchTxType('수입')">수입</button>
        <input type="hidden" name="tx_type" id="search_tx_type" value="{{ init_tx_type }}">
    </div>

    <div class="card" id="filter-panel">
        <div class="field">
            <span class="field-label">기간</span>
            <div class="chips" style="margin-bottom: 8px;">
                <button type="button" class="chip" onclick="window.setPeriod(0)">이번 달</button>
                <button type="button" class="chip" onclick="window.setPeriod(-1)">지난달</button>
                <button type="button" class="chip" onclick="window.setPeriod(-2, 3)">최근 3개월</button>
                <button type="button" class="chip" onclick="window.setPeriod(null)">전체 기간</button>
            </div>
            <div class="row-2" style="align-items: center;">
                <input type="date" name="start_date" id="search_start_date" class="input-field" value="{{ default_start }}" aria-label="시작일">
                <span class="muted" style="flex: 0 0 auto;">~</span>
                <input type="date" name="end_date" id="search_end_date" class="input-field" value="{{ default_end }}" aria-label="종료일">
            </div>
        </div>
        <div class="field">
            <label for="search_category_select">분류</label>
            <select name="category_id" id="search_category_select" class="input-field">
                <option value="">전체 분류</option>
                {% for cat in categories %}<option value="{{ cat.id }}" {% if cat.id == init_category_id %}selected{% endif %}>{{ cat.name }}</option>{% endfor %}
            </select>
        </div>
        <div class="field">
            <span class="field-label">금액</span>
            <div class="row-2" style="align-items: center;">
                <input type="text" inputmode="numeric" name="min_amount" id="search_min_amount" class="input-field" placeholder="최소" oninput="window.formatNumber(this)" aria-label="최소 금액">
                <span class="muted" style="flex: 0 0 auto;">~</span>
                <input type="text" inputmode="numeric" name="max_amount" id="search_max_amount" class="input-field" placeholder="최대" oninput="window.formatNumber(this)" aria-label="최대 금액">
            </div>
        </div>
        <div class="chips" style="margin-bottom: 16px;">
            <label class="chip"><input type="checkbox" name="exclude_budget_only" id="search_exclude_budget_only" value="1"> 예산 제외만</label>
            <label class="chip"><input type="checkbox" name="exclude_analysis_only" id="search_exclude_analysis_only" value="1"> 분석 제외만</label>
        </div>
        <div class="row-2">
            <button type="button" class="btn secondary" onclick="window.resetSearch()">초기화</button>
            <button type="submit" class="btn">적용</button>
        </div>
    </div>
</form>

<div class="summary-bar" id="results-summary"></div>
<div id="tx-results"></div>
<div id="load-more-wrap" style="text-align: center; padding: 18px;">
    <button type="button" class="chip" onclick="window.loadMoreResults(false)" style="display: none;">더보기</button>
    <div id="loading-text" class="caption" style="display: none;">모든 내역을 불러왔어요</div>
</div>

<script>
    window.defaultStart = {{ default_start | tojson }};
    window.defaultEnd = {{ default_end | tojson }};
</script>
<script>
{
    const esc = window.escapeHtml, won = window.won;
    const $ = id => document.getElementById(id);
    window.txDataStore = {};
    window.searchState = { page: 1, hasNext: true, isLoading: false, lastDate: '' };

    const pad = n => String(n).padStart(2, '0');
    const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;

    function syncTypeChips() {
        const v = $('search_tx_type').value;
        document.querySelectorAll('.type-chips .chip').forEach(c => c.classList.toggle('active', c.dataset.type === v));
    }
    function updateFilterCount() {
        let n = 0;
        if ($('search_category_select').value) n++;
        if ($('search_min_amount').value || $('search_max_amount').value) n++;
        if ($('search_exclude_budget_only').checked || $('search_exclude_analysis_only').checked) n++;
        if ($('search_start_date').value !== window.defaultStart || $('search_end_date').value !== window.defaultEnd) n++;
        const el = $('filter-count');
        el.textContent = n; el.style.display = n ? 'inline-flex' : 'none';
    }

    window.txItemHtml = function(tx) {
        return `<button type="button" class="list-row" onclick="window.openTxSheet({tx: window.txDataStore[${tx.id}]})">
            <span class="avatar" style="background:${window.safeColor(tx.category_color)}">${esc((tx.category || '?').slice(0, 1))}</span>
            <div class="grow">
                <div class="title">${esc(tx.title || tx.category)}</div>
                <div class="meta"><span class="dot" style="width:8px;height:8px;background:${window.safeColor(tx.transactor_color)}"></span>${esc(tx.transactor)} · ${esc(tx.category)} · ${tx.time}
                    ${tx.exclude_analysis ? '<span class="badge">분석제외</span>' : ''}${tx.exclude_budget ? '<span class="badge">예산제외</span>' : ''}</div>
                ${tx.memo ? `<div class="meta" style="margin-top:2px;">${esc(tx.memo)}</div>` : ''}
            </div>
            <span class="amount ${tx.tx_type === '수입' ? 'income-text' : ''}">${tx.tx_type === '수입' ? '+' : '-'}${won(tx.amount)}</span>
        </button>`;
    };

    window.buildSearchQuery = function(page) {
        const fd = new FormData($('search-form'));
        const params = new URLSearchParams();
        for (const [k, v] of fd.entries()) {
            if (!v) continue;
            params.set(k, (k === 'min_amount' || k === 'max_amount') ? v.replace(/,/g, '') : v);
        }
        params.set('page', page);
        return params.toString();
    };

    window.loadMoreResults = async function(reset) {
        const results = $('tx-results');
        if (reset) {
            window.searchState = { page: 1, hasNext: true, isLoading: false, lastDate: '' };
            results.classList.add('is-refreshing');
            updateFilterCount();
        }
        const s = window.searchState;
        if (s.isLoading || !s.hasNext) return;
        s.isLoading = true;
        const btn = document.querySelector('#load-more-wrap button');
        if (btn && !reset) { btn.textContent = '불러오는 중...'; }
        $('loading-text').style.display = 'none';

        try {
            const res = await fetch(`/api/transactions?${window.buildSearchQuery(s.page)}`);
            if (!res.ok) { window.showToast(await window.readError(res, '검색하지 못했어요.'), 'error'); s.isLoading = false; return; }
            const data = await res.json();
            if (reset) {
                results.innerHTML = '';
                results.classList.remove('is-refreshing');
                $('results-summary').innerHTML = `<span><b style="color:var(--text)">${data.total_count}건</b></span>
                    <span>${data.sum_income ? `수입 <b class="income-text">+${won(data.sum_income)}</b> · ` : ''}지출 <b style="color:var(--text)">-${won(data.sum_expense)}</b></span>`;
            }
            let group = results.lastElementChild && results.lastElementChild.classList.contains('day-group') ? results.lastElementChild : null;
            data.transactions.forEach(tx => {
                window.txDataStore[tx.id] = tx;
                if (tx.date !== s.lastDate) {
                    s.lastDate = tx.date;
                    results.insertAdjacentHTML('beforeend', `<div class="date-head"><span>${window.getDowStr(tx.date)}</span></div><div class="day-group list"></div>`);
                    group = results.lastElementChild;
                }
                group.insertAdjacentHTML('beforeend', window.txItemHtml(tx));
            });
            s.hasNext = data.has_next;
            s.page++;
            if (s.page === 2 && data.transactions.length === 0) {
                results.innerHTML = `<div class="card"><div class="empty">조건에 맞는 내역이 없어요</div></div>`;
            }
            if (btn) { btn.textContent = '더보기'; btn.style.display = s.hasNext ? 'inline-flex' : 'none'; }
            $('loading-text').style.display = (!s.hasNext && data.total_count > 0) ? 'block' : 'none';
            window.refreshResultsObserver();
        } catch (e) {
            results.classList.remove('is-refreshing');
        } finally { s.isLoading = false; }
    };

    if (window.txResultsObserver) window.txResultsObserver.disconnect();
    window.txResultsObserver = new IntersectionObserver(entries => {
        entries.forEach(e => { if (e.isIntersecting && window.searchState.page > 1) window.loadMoreResults(false); });
    }, { rootMargin: '300px' });
    window.refreshResultsObserver = function() {
        window.txResultsObserver.disconnect();
        const target = $('load-more-wrap');
        if (target) window.txResultsObserver.observe(target);
    };

    window.setSearchTxType = function(type) {
        $('search_tx_type').value = type;
        syncTypeChips();
        window.loadMoreResults(true);
    };
    window.setPeriod = function(offset, months) {
        if (offset === null) { $('search_start_date').value = ''; $('search_end_date').value = ''; }
        else {
            const now = new Date();
            const start = new Date(now.getFullYear(), now.getMonth() + offset, 1);
            const end = new Date(start.getFullYear(), start.getMonth() + (months || 1), 0);
            $('search_start_date').value = ymd(start);
            $('search_end_date').value = ymd(offset === 0 || months ? new Date(now.getFullYear(), now.getMonth() + 1, 0) : end);
        }
        window.loadMoreResults(true);
    };
    window.resetSearch = function() {
        $('search_keyword').value = '';
        $('search_start_date').value = window.defaultStart;
        $('search_end_date').value = window.defaultEnd;
        $('search_min_amount').value = '';
        $('search_max_amount').value = '';
        $('search_category_select').value = '';
        $('search_exclude_budget_only').checked = false;
        $('search_exclude_analysis_only').checked = false;
        $('search_tx_type').value = '';
        syncTypeChips();
        window.loadMoreResults(true);
    };

    $('search-form').addEventListener('submit', e => {
        e.preventDefault();
        $('search_keyword').blur();
        $('filter-panel').classList.remove('open');
        window.loadMoreResults(true);
    });
    ['search_category_select', 'search_start_date', 'search_end_date', 'search_exclude_budget_only', 'search_exclude_analysis_only']
        .forEach(id => $(id).addEventListener('change', () => window.loadMoreResults(true)));

    window.onTxChanged = () => window.loadMoreResults(true);
    window.onCategoriesChanged = function(cats) {
        const sel = $('search_category_select');
        const v = sel.value;
        sel.innerHTML = '<option value="">전체 분류</option>' + cats.map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join('');
        sel.value = v;
    };

    syncTypeChips();
    updateFilterCount();
    window.loadMoreResults(true);
}
</script>
{% endblock %}
