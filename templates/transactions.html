{% extends "base.html" %}
{% block content %}
<style>
    input[type="date"], input[type="time"], input[type="text"], input[type="number"], select { width: 100%; max-width: 100%; box-sizing: border-box; appearance: none; -webkit-appearance: none; }
    .flex-row > .input-wrapper { flex: 1 1 0px; min-width: 0; }

    .date-divider { font-size: 14px; font-weight: 700; color: var(--color-secondary); margin: 24px 0 8px 0; border-bottom: 2px solid var(--color-line); padding-bottom: 4px; }
    .tx-item { padding: 16px; margin-bottom: 8px; background: var(--color-canvas); border: 1px solid var(--color-line); border-radius: var(--radius-card); display: flex; justify-content: space-between; align-items: flex-start; }
    .tx-memo { font-size: 13px; color: var(--color-muted); margin-top: 4px; background: var(--color-line); padding: 4px 8px; border-radius: 4px; display: inline-block; }
    .btn-tab { flex: 1; padding: 10px; border-radius: 8px; border: 1px solid var(--color-line); background: var(--color-canvas); color: var(--color-muted); font-weight: 700; font-size: 14px; cursor: pointer; transition: all 0.2s; }
    .btn-tab.active { background: var(--color-action); color: var(--color-canvas); border-color: var(--color-action); }

    .fab { position: fixed; bottom: calc(env(safe-area-inset-bottom) + 84px); right: 20px; width: 56px; height: 56px; border-radius: 28px; background: var(--color-action); color: #fff; font-size: 28px; font-weight: 300; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 12px rgba(6, 169, 108, 0.4); z-index: 999; cursor: pointer; border: none; text-decoration: none; }

    #edit-sheet-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 1001; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; }
    #edit-sheet-overlay.active { opacity: 1; pointer-events: auto; }
    #edit-bottom-sheet { position: fixed; bottom: 0; left: 0; right: 0; background: var(--color-canvas); border-radius: 24px 24px 0 0; padding: 24px; z-index: 1002; transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); box-sizing: border-box; max-height: 90vh; overflow-y: auto; }
    #edit-bottom-sheet.active { transform: translateY(0); }
</style>

{% set uncat = categories | selectattr('name', 'equalto', '미분류') | first %}

<h2 style="font-size: 20px; font-weight: 700; margin-bottom: var(--spacing-lg);">내역 검색</h2>

<div class="card" style="margin-bottom: 8px;">
    <form id="search-form">
        <div style="display: flex; gap: 8px; margin-bottom: 12px;">
            <button type="button" id="search-btn-all" class="btn-tab active" onclick="window.setSearchTxType('')">전체</button>
            <button type="button" id="search-btn-expense" class="btn-tab" onclick="window.setSearchTxType('지출')">지출</button>
            <button type="button" id="search-btn-income" class="btn-tab" onclick="window.setSearchTxType('수입')">수입</button>
            <input type="hidden" name="tx_type" id="search_tx_type" value="">
        </div>

        <div class="flex-row">
            <div class="input-wrapper"><input type="text" name="keyword" id="search_keyword" class="input-field" placeholder="검색어 (제목, 메모)"></div>
        </div>

        <div class="flex-row">
            <div class="input-wrapper"><input type="date" name="start_date" id="search_start_date" class="input-field" value="{{ default_start }}"></div>
            <span style="color: var(--color-muted);">~</span>
            <div class="input-wrapper"><input type="date" name="end_date" id="search_end_date" class="input-field" value="{{ default_end }}"></div>
        </div>

        <div class="flex-row">
            <div class="input-wrapper"><input type="number" name="min_amount" id="search_min_amount" class="input-field" placeholder="최소 금액(원)"></div>
            <span style="color: var(--color-muted);">~</span>
            <div class="input-wrapper"><input type="number" name="max_amount" id="search_max_amount" class="input-field" placeholder="최대 금액(원)"></div>
        </div>

        <div class="flex-row">
            <div class="input-wrapper" style="display: flex; gap: 8px;">
                <select name="category_id" id="search_category_select" class="input-field" style="flex: 1;">
                    <option value="">전체 분류</option>
                    {% for cat in categories %}<option value="{{ cat.id }}">{{ cat.name }}</option>{% endfor %}
                </select>
                <button type="button" class="chip" onclick="window.openCatModal()" style="flex: 0 0 auto;">분류 편집</button>
            </div>
        </div>

        <div class="flex-row" style="margin-bottom: 0;">
            <button type="submit" class="btn-action" style="flex: 1;">검색</button>
            <button type="button" class="chip" style="padding: 12px 16px;" onclick="window.resetSearch()">초기화</button>
        </div>
    </form>
</div>

<h3 id="results-count" style="font-size: 16px; font-weight: 700; margin: 24px 0 4px;">검색 결과</h3>
<div id="tx-results"></div>
<div id="load-more-wrap" style="text-align: center; padding: 20px;">
    <button type="button" class="chip" onclick="window.loadMoreResults(false)" style="padding: 10px 24px; font-size: 14px; cursor: pointer; display: none;">더보기</button>
    <div id="loading-text" style="display: none; color: var(--color-muted); font-size: 14px;">모든 내역을 불러왔습니다.</div>
</div>

<button class="fab no-spa" onclick="window.openAddSheet()">+</button>

<div id="edit-sheet-overlay" onclick="window.closeEditSheet()"></div>
<div id="edit-bottom-sheet">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
        <h3 id="sheet-title" style="font-size: 18px; font-weight: 700;">내역 등록</h3>
        <button type="button" class="chip" onclick="window.closeEditSheet()" style="background: none; color: var(--color-muted); font-size: 18px; padding: 0;">✕</button>
    </div>

    <form id="tx-edit-form" method="POST">
        <div style="display: flex; gap: 8px; margin-bottom: 16px;">
            <button type="button" id="edit-btn-expense" class="btn-tab active" onclick="window.setEditTxType('지출')">지출</button>
            <button type="button" id="edit-btn-income" class="btn-tab" onclick="window.setEditTxType('수입')">수입</button>
            <input type="hidden" name="tx_type" id="edit_tx_type" value="지출">
        </div>

        <div class="flex-row">
            <div class="input-wrapper"><input type="text" inputmode="numeric" id="edit_amount_input" name="amount" class="input-field" oninput="window.formatNumber(this)" required></div>
        </div>

        <div id="edit-transactor-group" style="display: flex; gap: 8px; margin-bottom: 16px;">
            {% for u in ledger.users %}
            <button type="button" class="btn-tab" data-value="{{ u.nickname }}" onclick="window.setTransactor(this)">{{ u.nickname }}</button>
            {% endfor %}
            <button type="button" class="btn-tab" data-value="함께" onclick="window.setTransactor(this)">함께</button>
            <input type="hidden" name="transactor">
        </div>

        <div class="flex-row">
            <div class="input-wrapper"><input type="text" id="edit_title_input" name="title" class="input-field" required></div>
        </div>

        <div class="flex-row">
            <div class="input-wrapper">
                <select name="category_id" id="edit_category_select" class="input-field">
                    <option value="{{ uncat.id if uncat else '' }}">미분류</option>
                    {% for cat in categories if cat.name != '미분류' %}
                        <option value="{{ cat.id }}">{{ cat.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="input-wrapper" style="flex: 0 0 140px;">
                <input type="date" name="date" id="edit_date_input" class="input-field" required style="width: 100%;">
            </div>
        </div>

        <div class="flex-row" style="margin-bottom: 12px;">
            <div class="input-wrapper"><input type="text" id="edit_memo_input" name="memo" class="input-field" placeholder="상세 메모 (선택사항)"></div>
            <input type="hidden" name="time" id="edit_time_input">
            <button type="button" class="chip" onclick="document.getElementById('time-dialog-edit').showModal()" style="padding: 10px 12px; font-size: 16px; flex: 0 0 auto;">🕒</button>
        </div>

        <div class="flex-row" style="margin-bottom: 16px;">
            <label style="display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--color-secondary); cursor: pointer;">
                <input type="checkbox" id="edit_exclude_analysis" name="exclude_analysis" style="width:16px; height:16px;"> 지출 분석에서 제외하기
            </label>
        </div>

        <button type="submit" class="btn-action" style="width: 100%;">저장하기</button>
    </form>
</div>

<dialog id="time-dialog-edit">
    <div style="display: flex; justify-content: space-between; margin-bottom: 16px;">
        <h3 style="font-size: 18px; font-weight: 700;">시간 설정</h3>
        <button type="button" class="chip" onclick="document.getElementById('time-dialog-edit').close()" style="background:none;">닫기</button>
    </div>
    <div class="flex-row">
        <div class="input-wrapper"><input type="time" id="time_picker_input_edit" class="input-field"></div>
    </div>
    <button type="button" class="btn-action" style="width:100%;" onclick="window.setTimeEdit()">확인</button>
</dialog>

<dialog id="cat-dialog">
    <div style="display: flex; justify-content: space-between; margin-bottom: 16px;">
        <h3 style="font-size: 18px; font-weight: 700;">분류 관리</h3>
        <button type="button" class="chip" onclick="document.getElementById('cat-dialog').close()" style="background:none;">닫기</button>
    </div>
    <div class="flex-row">
        <div class="input-wrapper"><input type="text" id="new_cat_name" class="input-field" placeholder="새 분류 이름"></div>
        <button type="button" class="btn-action" onclick="window.addCat()">추가</button>
    </div>
    <div id="cat-list" style="max-height: 300px; overflow-y: auto;"></div>
</dialog>

<script>
    window.defaultStart = "{{ default_start }}";
    window.defaultEnd = "{{ default_end }}";
    window.currentUserNickname = "{{ current_user.nickname }}";
</script>

<script>
    {
        window.txDataStore = window.txDataStore || {};
        window.searchState = { page: 1, hasNext: true, isLoading: false, lastRenderedDate: '' };

        window.renderTxItem = function(tx) {
            const color = tx.tx_type === '수입' ? 'var(--color-primary)' : '#fe493d';
            const sign = tx.tx_type === '수입' ? '+' : '-';
            const memoHtml = tx.memo ? `<div class="tx-memo">${tx.memo}</div>` : '';
            const excludeBadge = tx.exclude_analysis ? `<span style="font-size: 10px; background: var(--color-line); color: var(--color-muted); padding: 2px 4px; border-radius: 4px; margin-left: 4px;">분석제외</span>` : '';

            return `
                <div class="tx-item" style="border-left: 4px solid ${color};">
                    <div style="flex: 1;">
                        <div style="font-size: 12px; color: var(--color-secondary); margin-bottom: 4px;">🧑 ${tx.transactor} | 🏷️ ${tx.category}</div>
                        <div style="font-weight: 700; font-size: 16px; word-break: break-all;">${tx.title}${excludeBadge}</div>${memoHtml}
                    </div>
                    <div style="text-align: right; margin-left: 12px; min-width: 80px;">
                        <div style="font-weight: 700; font-size: 16px; color: ${color};">${sign}${tx.amount.toLocaleString()}원</div>
                        <div style="margin-top: 8px; display: flex; gap: 8px; justify-content: flex-end; align-items: center;">
                            <button onclick="window.openEditSheet(${tx.id})" style="background:none; border:none; color: var(--color-muted); font-size: 12px; cursor: pointer; padding: 0;">수정</button>
                            <span style="color: var(--color-line);">|</span>
                            <button onclick="window.deleteTx(${tx.id})" style="background:none; border:none; color: var(--color-muted); font-size: 12px; cursor: pointer; padding: 0;">삭제</button>
                        </div>
                    </div>
                </div>`;
        };

        window.buildSearchQuery = function(page) {
            const fd = new FormData(document.getElementById('search-form'));
            const params = new URLSearchParams();
            for (const [k, v] of fd.entries()) { if (v) params.set(k, v); }
            params.set('page', page);
            return params.toString();
        };

        window.loadMoreResults = async function(reset) {
            const resultsEl = document.getElementById('tx-results');
            if (reset) {
                window.searchState = { page: 1, hasNext: true, isLoading: false, lastRenderedDate: '' };
                resultsEl.innerHTML = '';
                document.getElementById('load-more-wrap').style.display = '';
            }
            const s = window.searchState;
            if (s.isLoading || !s.hasNext) return;
            s.isLoading = true;

            const btn = document.querySelector('#load-more-wrap button');
            const txt = document.getElementById('loading-text');
            if (btn) { btn.innerText = '불러오는 중...'; btn.style.display = 'inline-block'; }
            if (txt) txt.style.display = 'none';

            try {
                const res = await fetch(`/api/transactions?${window.buildSearchQuery(s.page)}`);
                const data = await res.json();

                const isFirstPage = s.page === 1;
                if (isFirstPage) {
                    document.getElementById('results-count').innerText = `검색 결과 (${data.total_count}건)`;
                }

                let htmlBuffer = '';
                data.transactions.forEach(tx => {
                    window.txDataStore[tx.id] = tx;
                    if (tx.date !== s.lastRenderedDate) {
                        htmlBuffer += `<div class="date-divider">${window.getDowStr(tx.date)}</div>`;
                        s.lastRenderedDate = tx.date;
                    }
                    htmlBuffer += window.renderTxItem(tx);
                });

                s.hasNext = data.has_next;
                s.page++;
                s.isLoading = false;

                resultsEl.innerHTML += htmlBuffer;

                const newBtn = document.querySelector('#load-more-wrap button');
                const newTxt = document.getElementById('loading-text');

                if (s.hasNext) {
                    if (newBtn) { newBtn.innerText = '더보기'; newBtn.style.display = 'inline-block'; }
                } else {
                    if (newBtn) newBtn.style.display = 'none';
                    if (isFirstPage && data.transactions.length === 0) {
                        resultsEl.innerHTML = `<div style="text-align:center; padding: 40px 0; color: var(--color-muted);">검색 조건에 맞는 내역이 없습니다.</div>`;
                    } else if (newTxt) {
                        newTxt.style.display = 'block';
                    }
                }
                window.refreshResultsObserver();
            } catch(e) { s.isLoading = false; }
        };

        if (window.txResultsObserver) window.txResultsObserver.disconnect();
        window.txResultsObserver = new IntersectionObserver((entries) => {
            entries.forEach(e => { if (e.isIntersecting) window.loadMoreResults(false); });
        }, { rootMargin: '200px' });

        window.refreshResultsObserver = function() {
            window.txResultsObserver.disconnect();
            const target = document.getElementById('load-more-wrap');
            if (target) window.txResultsObserver.observe(target);
        };

        window.setSearchTxType = function(type) {
            document.getElementById('search_tx_type').value = type;
            document.querySelectorAll('#search-btn-all, #search-btn-expense, #search-btn-income').forEach(b => b.classList.remove('active'));
            if (type === '지출') document.getElementById('search-btn-expense').classList.add('active');
            else if (type === '수입') document.getElementById('search-btn-income').classList.add('active');
            else document.getElementById('search-btn-all').classList.add('active');
            window.loadMoreResults(true);
        };

        window.resetSearch = function() {
            document.getElementById('search_keyword').value = '';
            document.getElementById('search_start_date').value = window.defaultStart;
            document.getElementById('search_end_date').value = window.defaultEnd;
            document.getElementById('search_min_amount').value = '';
            document.getElementById('search_max_amount').value = '';
            document.getElementById('search_category_select').value = '';
            window.setSearchTxType('');
        };

        document.getElementById('search-form').addEventListener('submit', (e) => {
            e.preventDefault();
            window.loadMoreResults(true);
        });

        window.loadMoreResults(true);

        window.setTimeEdit = function() {
            document.getElementById('edit_time_input').value = document.getElementById('time_picker_input_edit').value;
            document.getElementById('time-dialog-edit').close();
        };

        window.openCatModal = function() {
            document.getElementById('cat-dialog').showModal(); window.loadCategories();
        };

        window.loadCategories = async function() {
            const res = await fetch('/api/categories');
            const cats = await res.json();
            const editableCats = cats.filter(c => c.name !== '미분류');
            const uncat = cats.find(c => c.name === '미분류');

            const list = document.getElementById('cat-list');
            if(list) {
                list.innerHTML = editableCats.map(c => `
                    <div style="display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--color-line); align-items: center;">
                        <div style="flex:1;">
                            <input type="text" id="cat-name-${c.id}" value="${c.name}" class="input-field" style="display:none; padding:4px 8px; width:120px;">
                            <span id="cat-span-${c.id}" style="font-size: 14px; font-weight: 500;">${c.name}</span>
                        </div>
                        <div style="display:flex; gap: 4px; align-items:center;">
                            <button type="button" onclick="window.moveCat(${c.id}, 'up')" style="background:none;border:none;font-size:14px;cursor:pointer;">▲</button>
                            <button type="button" onclick="window.moveCat(${c.id}, 'down')" style="background:none;border:none;font-size:14px;cursor:pointer;">▼</button>
                            <button type="button" id="cat-edit-btn-${c.id}" class="chip" onclick="window.enableEdit(${c.id})" style="padding:4px 8px;font-size:12px;">수정</button>
                            <button type="button" id="cat-save-btn-${c.id}" class="chip" onclick="window.saveCat(${c.id})" style="display:none; background:var(--color-action); color:#fff; padding:4px 8px;font-size:12px;">저장</button>
                            <button type="button" onclick="window.deleteCat(${c.id})" style="background:none;border:none;color:#fe493d;font-size:12px;padding:4px;cursor:pointer;">삭제</button>
                        </div>
                    </div>
                `).join('');
            }

            const editSelect = document.getElementById('edit_category_select');
            const evalue = editSelect ? editSelect.value : '';
            const editHtml = `<option value="${uncat ? uncat.id : ''}">미분류</option>` + editableCats.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
            if(editSelect) { editSelect.innerHTML = editHtml; editSelect.value = evalue; }

            const searchSelect = document.getElementById('search_category_select');
            const svalue = searchSelect ? searchSelect.value : '';
            const searchHtml = `<option value="">전체 분류</option>` + cats.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
            if(searchSelect) { searchSelect.innerHTML = searchHtml; searchSelect.value = svalue; }
        };

        window.addCat = async function() {
            const n = document.getElementById('new_cat_name'); if (!n || !n.value) return;
            try {
                const res = await fetch('/api/category/add', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({name: n.value})});
                if (!res.ok) throw new Error();
                n.value = ''; window.loadCategories();
            } catch(err) { window.showToast('분류 추가에 실패했습니다.', 'error'); }
        };
        window.enableEdit = function(id) { document.getElementById(`cat-span-${id}`).style.display = 'none'; document.getElementById(`cat-name-${id}`).style.display = 'inline-block'; document.getElementById(`cat-edit-btn-${id}`).style.display = 'none'; document.getElementById(`cat-save-btn-${id}`).style.display = 'inline-block'; };
        window.saveCat = async function(id) {
            const name = document.getElementById(`cat-name-${id}`).value;
            try {
                const res = await fetch(`/api/category/${id}/edit`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({name})});
                if (!res.ok) throw new Error();
                window.loadCategories();
            } catch(err) { window.showToast('분류 수정에 실패했습니다.', 'error'); }
        };
        window.deleteCat = async function(id) {
            if (!confirm('삭제하시겠습니까?')) return;
            try {
                const res = await fetch(`/api/category/${id}/delete`, { method: 'POST' });
                if (!res.ok) throw new Error();
                window.loadCategories();
            } catch(err) { window.showToast('분류 삭제에 실패했습니다.', 'error'); }
        };
        window.moveCat = async function(id, dir) {
            try {
                const res = await fetch(`/api/category/${id}/move`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({dir})});
                if (!res.ok) throw new Error();
                window.loadCategories();
            } catch(err) { window.showToast('분류 순서 변경에 실패했습니다.', 'error'); }
        };

        window.setEditTxType = function(type) {
            document.getElementById('edit_tx_type').value = type;
            if (type === '지출') {
                document.getElementById('edit-btn-expense').classList.add('active');
                document.getElementById('edit-btn-income').classList.remove('active');
            } else {
                document.getElementById('edit-btn-income').classList.add('active');
                document.getElementById('edit-btn-expense').classList.remove('active');
            }
        };

        window.openAddSheet = function() {
            document.getElementById('sheet-title').innerText = '내역 등록';
            document.getElementById('tx-edit-form').action = '/transaction';

            window.setEditTxType('지출');
            document.getElementById('edit_amount_input').value = '';
            window.syncTransactorGroup(document.getElementById('edit-transactor-group'), window.currentUserNickname);
            document.getElementById('edit_title_input').value = '';
            document.getElementById('edit_category_select').value = document.querySelector('#edit_category_select option').value;

            const now = new Date();
            const y = now.getFullYear(), m = String(now.getMonth()+1).padStart(2,'0'), d = String(now.getDate()).padStart(2,'0');
            const hh = String(now.getHours()).padStart(2,'0'), mi = String(now.getMinutes()).padStart(2,'0');
            document.getElementById('edit_date_input').value = `${y}-${m}-${d}`;
            document.getElementById('edit_time_input').value = `${hh}:${mi}`;
            document.getElementById('time_picker_input_edit').value = `${hh}:${mi}`;

            document.getElementById('edit_memo_input').value = '';
            document.getElementById('edit_exclude_analysis').checked = false;

            document.getElementById('edit-sheet-overlay').classList.add('active');
            document.getElementById('edit-bottom-sheet').classList.add('active');
        };

        window.openEditSheet = function(id) {
            const tx = window.txDataStore[id];
            if(!tx) return;
            document.getElementById('sheet-title').innerText = '내역 수정';
            document.getElementById('tx-edit-form').action = `/transaction/${tx.id}/edit`;

            window.setEditTxType(tx.tx_type);
            document.getElementById('edit_amount_input').value = tx.amount.toLocaleString();
            window.syncTransactorGroup(document.getElementById('edit-transactor-group'), tx.transactor);
            document.getElementById('edit_title_input').value = tx.title;
            document.getElementById('edit_category_select').value = tx.category_id || document.querySelector('#edit_category_select option').value;
            document.getElementById('edit_date_input').value = tx.date;
            document.getElementById('edit_time_input').value = tx.time;
            document.getElementById('time_picker_input_edit').value = tx.time;
            document.getElementById('edit_memo_input').value = tx.memo || "";
            document.getElementById('edit_exclude_analysis').checked = tx.exclude_analysis;

            document.getElementById('edit-sheet-overlay').classList.add('active');
            document.getElementById('edit-bottom-sheet').classList.add('active');
        };

        window.closeEditSheet = function() {
            document.getElementById('edit-sheet-overlay').classList.remove('active');
            document.getElementById('edit-bottom-sheet').classList.remove('active');
        };

        document.getElementById('tx-edit-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            if (btn.disabled) return;
            btn.disabled = true;
            const isAdd = e.target.action.endsWith('/transaction');
            const fd = new FormData(e.target); fd.append('ajax', '1');
            try {
                const res = await fetch(e.target.action, {method: 'POST', body: fd});
                if(res.ok) {
                    window.closeEditSheet();
                    window.showToast(isAdd ? '등록이 완료되었습니다.' : '수정이 완료되었습니다.', 'success');
                    window.loadMoreResults(true);
                } else {
                    window.showToast(isAdd ? '등록에 실패했습니다. 다시 시도해주세요.' : '수정에 실패했습니다. 다시 시도해주세요.', 'error');
                }
            } catch(err) {
                window.showToast('네트워크 오류로 처리하지 못했습니다.', 'error');
            } finally {
                btn.disabled = false;
            }
        });

        window.deleteTx = async function(id) {
            if(!confirm('정말 삭제하시겠습니까?')) return;
            try {
                let fd = new FormData(); fd.append('ajax', '1');
                let res = await fetch(`/transaction/${id}/delete`, {method:'POST', body: fd});
                if(res.ok) {
                    window.showToast('삭제되었습니다.', 'success');
                    window.loadMoreResults(true);
                } else {
                    window.showToast('삭제에 실패했습니다. 다시 시도해주세요.', 'error');
                }
            } catch(err) {
                window.showToast('네트워크 오류로 삭제하지 못했습니다.', 'error');
            }
        };
    }
</script>
{% endblock %}
