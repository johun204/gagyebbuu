{% extends "base.html" %}
{% block content %}
<style>
    .date-divider { font-size: 14px; font-weight: 700; color: var(--color-secondary); margin: 24px 0 8px 0; border-bottom: 2px solid var(--color-line); padding-bottom: 4px; }
    .tx-item { padding: 16px; margin-bottom: 8px; background: var(--color-canvas); border: 1px solid var(--color-line); border-radius: var(--radius-card); display: flex; justify-content: space-between; align-items: flex-start; }
    .tx-memo { font-size: 13px; color: var(--color-muted); margin-top: 4px; background: var(--color-line); padding: 4px 8px; border-radius: 4px; display: inline-block; }
    .btn-tab { flex: 1; padding: 10px; border-radius: 8px; border: 1px solid var(--color-line); background: var(--color-canvas); color: var(--color-muted); font-weight: 700; font-size: 14px; cursor: pointer; transition: all 0.2s; }
    .btn-tab.active { background: var(--color-action); color: var(--color-canvas); border-color: var(--color-action); }
    dialog { border: 1px solid var(--color-line); border-radius: var(--radius-card); padding: 24px; width: 90%; max-width: 400px; margin: auto; background: var(--color-canvas); box-shadow: 0 17px 50px rgba(0,0,0,.19); box-sizing: border-box; }
    dialog::backdrop { background: rgba(17, 17, 17, 0.4); }
</style>

<div class="month-selector">
    <a href="/transactions?year={{ p_y }}&month={{ p_m }}">◀</a> 
    <h3>{{ t_year }}년 {{ t_month }}월 내역</h3>
    <a href="/transactions?year={{ n_y }}&month={{ n_m }}">▶</a>
</div>

<div class="card" style="margin-bottom: 8px;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
        <h3 style="font-size: 16px; font-weight: 700;">새 내역 등록</h3>
        <a href="/search" class="chip no-spa" style="text-decoration: none;">🔍 내역 검색</a>
    </div>
    
    <form action="/transaction" method="POST">
        <div style="display: flex; gap: 8px; margin-bottom: 16px;">
            <button type="button" id="btn-expense" class="btn-tab active" onclick="window.setTxType('지출')">지출</button>
            <button type="button" id="btn-income" class="btn-tab" onclick="window.setTxType('수입')">수입</button>
            <input type="hidden" name="tx_type" id="tx_type" value="지출">
        </div>

        <div class="flex-row">
            <div class="input-wrapper"><input type="number" id="amount_input" name="amount" class="input-field" placeholder="지출 금액(원)" required></div>
        </div>
        
        <div class="flex-row">
            <div class="input-wrapper" style="flex: 0 0 120px;">
                <select name="transactor" required class="input-field">
                    {% for u in ledger.users %}<option value="{{ u.nickname }}" {% if u.id == current_user.id %}selected{% endif %}>{{ u.nickname }}</option>{% endfor %}
                    <option value="함께">함께</option>
                </select>
            </div>
            <div class="input-wrapper"><input type="text" name="title" class="input-field" placeholder="제목 (예: 스타벅스)" required></div>
        </div>
        
        <div class="flex-row">
            <div class="input-wrapper" style="display: flex; gap: 8px;">
                <select name="category_id" id="category_select" class="input-field" style="flex: 1;">
                    <option value="">미분류</option>
                    {% for cat in categories if cat.name != '미분류' %}
                        <option value="{{ cat.id }}">{{ cat.name }}</option>
                    {% endfor %}
                </select>
                <button type="button" class="chip" onclick="window.openCatModal()">분류 편집</button>
            </div>
        </div>
        
        <div class="flex-row">
            <div class="input-wrapper" style="display: flex; gap: 8px;">
                <input type="date" name="date" class="input-field" value="{{ now.strftime('%Y-%m-%d') }}" required style="flex: 1;">
                <input type="hidden" name="time" id="tx_time" value="{{ now.strftime('%H:%M') }}">
                <button type="button" class="chip" onclick="document.getElementById('time-dialog').showModal()" style="padding: 10px 12px; font-size: 16px;">🕒</button>
            </div>
        </div>
        
        <div class="flex-row" style="margin-bottom: 12px;">
            <div class="input-wrapper"><input type="text" name="memo" class="input-field" placeholder="상세 메모 (선택사항)"></div>
        </div>
        
        <div class="flex-row" style="margin-bottom: 16px;">
            <label style="display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--color-secondary); cursor: pointer;">
                <input type="checkbox" name="exclude_analysis" style="width:16px; height:16px;"> 지출 분석에서 제외하기
            </label>
        </div>
        
        <button type="submit" class="btn-action" style="width: 100%;">등록하기</button>
    </form>
</div>

<!-- 시간 설정 다이얼로그 -->
<dialog id="time-dialog">
    <div style="display: flex; justify-content: space-between; margin-bottom: 16px;">
        <h3 style="font-size: 18px; font-weight: 700;">시간 설정</h3>
        <button type="button" class="chip" onclick="document.getElementById('time-dialog').close()" style="background:none;">닫기</button>
    </div>
    <div class="flex-row">
        <div class="input-wrapper"><input type="time" id="time_picker_input" class="input-field" value="{{ now.strftime('%H:%M') }}"></div>
    </div>
    <button type="button" class="btn-action" style="width:100%;" onclick="window.setTime()">확인</button>
</dialog>

<!-- AJAX 카테고리 모달 -->
<dialog id="cat-dialog">
    <div style="display: flex; justify-content: space-between; margin-bottom: 16px;">
        <h3 style="font-size: 18px; font-weight: 700;">분류 관리</h3>
        <button type="button" class="chip" onclick="document.getElementById('cat-dialog').close()" style="background:none;">닫기</button>
    </div>
    <div class="flex-row">
        <div class="input-wrapper"><input type="text" id="new_cat_name" class="input-field" placeholder="새 분류 이름"></div>
        <button type="button" class="btn-action" onclick="window.addCat()">추가</button>
    </div>
    <div id="cat-list" style="max-height: 300px; overflow-y: auto;"></div>
</dialog>

<!-- 무한 스크롤 및 더보기 컨테이너 -->
<div id="tx-container"></div>
<div id="load-more-container" style="text-align: center; padding: 20px;">
    <button id="load-more-btn" type="button" class="chip" onclick="window.loadTransactions()" style="padding: 10px 24px; font-size: 14px; cursor: pointer; display: none;">더보기</button>
    <div id="loading-text" style="display: none; color: var(--color-muted); font-size: 14px;">모든 내역을 불러왔습니다.</div>
</div>

<script>
    {
        window.setTxType = function(type) {
            document.getElementById('tx_type').value = type;
            if (type === '지출') {
                document.getElementById('btn-expense').classList.add('active');
                document.getElementById('btn-income').classList.remove('active');
                document.getElementById('amount_input').placeholder = '지출 금액(원)';
            } else {
                document.getElementById('btn-income').classList.add('active');
                document.getElementById('btn-expense').classList.remove('active');
                document.getElementById('amount_input').placeholder = '수입 금액(원)';
            }
        };

        window.setTime = function() {
            document.getElementById('tx_time').value = document.getElementById('time_picker_input').value;
            document.getElementById('time-dialog').close();
        };

        window.openCatModal = function() {
            document.getElementById('cat-dialog').showModal();
            window.loadCategories();
        };

        window.loadCategories = async function() {
            const res = await fetch('/api/categories');
            const cats = await res.json();
            
            const editableCats = cats.filter(c => c.name !== '미분류');
            const uncategorized = cats.find(c => c.name === '미분류');
            
            const list = document.getElementById('cat-list');
            list.innerHTML = editableCats.map(c => `
                <div style="display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--color-line); align-items: center;">
                    <div style="flex:1;">
                        <input type="text" id="cat-name-${c.id}" value="${c.name}" class="input-field" style="display:none; padding:4px 8px; width:120px;">
                        <span id="cat-span-${c.id}" style="font-size: 14px; font-weight: 500;">${c.name}</span>
                    </div>
                    <div style="display:flex; gap: 4px; align-items:center;">
                        <button type="button" onclick="window.moveCat(${c.id}, 'up')" style="background:none;border:none;font-size:14px;cursor:pointer;">▲</button>
                        <button type="button" onclick="window.moveCat(${c.id}, 'down')" style="background:none;border:none;font-size:14px;cursor:pointer;">▼</button>
                        <button type="button" id="cat-edit-btn-${c.id}" class="chip" onclick="window.enableEdit(${c.id})" style="padding:4px 8px;font-size:12px;">수정</button>
                        <button type="button" id="cat-save-btn-${c.id}" class="chip" onclick="window.saveCat(${c.id})" style="display:none; background:var(--color-action); color:#fff; padding:4px 8px;font-size:12px;">저장</button>
                        <button type="button" onclick="window.deleteCat(${c.id})" style="background:none;border:none;color:#fe493d;font-size:12px;padding:4px;cursor:pointer;">삭제</button>
                    </div>
                </div>
            `).join('');

            const select = document.getElementById('category_select');
            const selectedValue = select.value;
            
            let selectHtml = '';
            if (uncategorized) selectHtml += `<option value="${uncategorized.id}">미분류</option>`;
            else selectHtml += `<option value="">미분류</option>`;
            
            selectHtml += editableCats.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
            select.innerHTML = selectHtml;
            select.value = selectedValue;
        };

        window.addCat = async function() {
            const name = document.getElementById('new_cat_name').value;
            if (!name) return;
            await fetch('/api/category/add', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({name})});
            document.getElementById('new_cat_name').value = '';
            window.loadCategories();
        };

        window.enableEdit = function(id) {
            document.getElementById(`cat-span-${id}`).style.display = 'none';
            document.getElementById(`cat-name-${id}`).style.display = 'inline-block';
            document.getElementById(`cat-edit-btn-${id}`).style.display = 'none';
            document.getElementById(`cat-save-btn-${id}`).style.display = 'inline-block';
        };

        window.saveCat = async function(id) {
            const name = document.getElementById(`cat-name-${id}`).value;
            await fetch(`/api/category/${id}/edit`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({name})});
            window.loadCategories();
        };

        window.deleteCat = async function(id) {
            if (!confirm('삭제하시겠습니까?')) return;
            await fetch(`/api/category/${id}/delete`, { method: 'POST' });
            window.loadCategories();
        };

        window.moveCat = async function(id, dir) {
            await fetch(`/api/category/${id}/move`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({dir})});
            window.loadCategories();
        };

        let currentPage = 1, hasNext = true, isLoading = false, lastRenderedDate = '';
        const txContainer = document.getElementById('tx-container');
        const loadMoreContainer = document.getElementById('load-more-container');
        const loadMoreBtn = document.getElementById('load-more-btn');
        const loadingText = document.getElementById('loading-text');
        
        txContainer.innerHTML = '';

        window.loadTransactions = function() {
            if (isLoading || !hasNext) return;
            isLoading = true; 
            loadMoreBtn.innerText = '불러오는 중...';
            loadMoreBtn.style.display = 'inline-block';
            loadingText.style.display = 'none';

            fetch(`/api/transactions?page=${currentPage}`)
                .then(res => res.json())
                .then(data => {
                    data.transactions.forEach(tx => {
                        if (tx.date !== lastRenderedDate) {
                            txContainer.innerHTML += `<div class="date-divider">${tx.date}</div>`;
                            lastRenderedDate = tx.date;
                        }
                        const isIncome = tx.tx_type === '수입', color = isIncome ? 'var(--color-primary)' : '#fe493d', sign = isIncome ? '+' : '-';
                        const memoHtml = tx.memo ? `<div class="tx-memo">${tx.memo}</div>` : '';
                        const excludeBadge = tx.exclude_analysis ? `<span style="font-size: 10px; background: var(--color-line); color: var(--color-muted); padding: 2px 4px; border-radius: 4px; margin-left: 4px;">분석제외</span>` : '';

                        txContainer.innerHTML += `
                            <div class="tx-item" style="border-left: 4px solid ${color};">
                                <div style="flex: 1;">
                                    <div style="font-size: 12px; color: var(--color-secondary); margin-bottom: 4px;">🧑 ${tx.transactor} | 🏷️ ${tx.category}</div>
                                    <div style="font-weight: 700; font-size: 16px; word-break: break-all;">${tx.title}${excludeBadge}</div>${memoHtml}
                                </div>
                                <div style="text-align: right; margin-left: 12px; min-width: 80px;">
                                    <div style="font-weight: 700; font-size: 16px; color: ${color};">${sign}${tx.amount.toLocaleString()}원</div>
                                    <div style="margin-top: 8px; display: flex; gap: 8px; justify-content: flex-end; align-items: center; line-height: 1;">
                                        <a href="/transaction/${tx.id}/edit" class="no-spa" style="font-size: 12px; color: var(--color-muted); text-decoration: none;">수정</a>
                                        <span style="color: var(--color-line);">|</span>
                                        <form action="/transaction/${tx.id}/delete" method="POST" style="display: flex; align-items: center; margin: 0;" onsubmit="return confirm('정말 삭제하시겠습니까?');">
                                            <button type="submit" style="background:none; border:none; color: var(--color-muted); font-size: 12px; cursor: pointer; padding: 0;">삭제</button>
                                        </form>
                                    </div>
                                </div>
                            </div>`;
                    });
                    
                    hasNext = data.has_next; 
                    currentPage++; 
                    isLoading = false;

                    if (hasNext) {
                        loadMoreBtn.innerText = '더보기';
                        loadMoreBtn.style.display = 'inline-block';
                        loadingText.style.display = 'none';
                    } else {
                        loadMoreBtn.style.display = 'none';
                        if (currentPage > 2 || data.transactions.length > 0) {
                            loadingText.style.display = 'block';
                        }
                    }
                });
        };

        if(window.txObserver) window.txObserver.disconnect();
        window.txObserver = new IntersectionObserver((entries) => { 
            if (entries[0].isIntersecting) window.loadTransactions(); 
        }, { rootMargin: '100px' });
        
        // 버튼과 텍스트를 감싸고 있는 전체 컨테이너를 관찰
        if(loadMoreContainer) window.txObserver.observe(loadMoreContainer);
    }
</script>
{% endblock %}
