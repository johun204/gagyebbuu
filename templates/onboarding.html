{% extends "base.html" %}
{% block content %}
<h2 style="text-align: center; margin-top: 40px; font-size: 24px; font-weight: 800; color: var(--color-primary);">가계쀼 시작하기</h2>
<p style="text-align: center; color: var(--color-secondary); font-size: 14px; margin-bottom: 32px;">환영합니다! 가계부를 생성하거나 초대 코드로 참여해주세요.</p>

<div class="card">
    <h3 style="font-size: 16px; font-weight: 700; margin-bottom: 12px;">새 가계부 만들기</h3>
    <form action="/onboarding" method="POST">
        <!-- SPA 통신 시 확실한 분기를 위한 hidden input -->
        <input type="hidden" name="action" value="create">
        <div class="input-wrapper" style="margin-bottom: 16px;">
            <input type="text" name="ledger_name" class="input-field" placeholder="가계부 이름 (예: 우리집 가계부)" required>
        </div>
        <button type="submit" class="btn-action" style="width: 100%;">생성하기</button>
    </form>
</div>

<div class="card">
    <h3 style="font-size: 16px; font-weight: 700; margin-bottom: 12px;">초대 코드로 참여하기</h3>
    <form action="/onboarding" method="POST">
        <!-- SPA 통신 시 확실한 분기를 위한 hidden input -->
        <input type="hidden" name="action" value="join">
        <div class="input-wrapper" style="margin-bottom: 16px;">
            <input type="text" name="invite_code" class="input-field" placeholder="전달받은 초대 코드" required>
        </div>
        <button type="submit" class="btn-action" style="width: 100%; background-color: var(--color-secondary);">참여하기</button>
    </form>
</div>

{% if error %}
<script>
    window.showToast('{{ error }}', 'error');
</script>
{% endif %}

{% endblock %}
