{% extends "base.html" %}
{% from '_icons.html' import icon %}
{% block content %}
{#- 예전 링크(/transaction/<id>/edit)로 들어온 경우: 공용 수정 시트를 바로 열어준다. -#}
<div class="appbar">
    <a href="{{ next_url or '/transactions' }}" class="icon-btn" style="margin-left: -8px;" aria-label="뒤로">{{ icon('chevron-left', 26) }}</a>
    <h1>내역 수정</h1>
</div>
<div class="card">
    <div class="list">
        <button type="button" class="list-row" onclick="window.openTxSheet({tx: window.editTx})">
            <div class="grow"><div class="title">{{ tx.title or '(내용 없음)' }}</div>
                <div class="meta">{{ tx.datetime_val.strftime('%Y.%m.%d %H:%M') }} · {{ tx.transactor }}</div></div>
            <span class="amount {% if tx.tx_type == '수입' %}income-text{% endif %}">{{ '+' if tx.tx_type == '수입' else '-' }}{{ '{:,}'.format(tx.amount) }}원</span>
        </button>
    </div>
</div>
<script>
    window.editTx = {{ tx_json | tojson }};
    window.onTxChanged = () => window.navigate({{ (next_url or '/transactions') | tojson }});
    setTimeout(() => window.openTxSheet && window.openTxSheet({tx: window.editTx}), 0);  // 시트 스크립트가 아래에서 먼저 준비되도록
</script>
{% endblock %}
